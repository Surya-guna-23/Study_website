<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgk2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="380" rx="12" fill="url(#bgk2)"/>
  <text x="360" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Koko Eating Bananas — Step 2 of 4</text>
  <text x="360" y="50" text-anchor="middle" fill="#6c7086" font-size="12">piles = [3, 6, 7, 11], h = 8</text>

  <!-- Piles visualization -->
  <text x="30" y="78" fill="#89b4fa" font-size="12" font-weight="bold">Banana Piles:</text>
  <g transform="translate(30, 88)">
    <rect x="0" y="20" width="55" height="30" rx="5" fill="#f9e2af"/><text x="27" y="40" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">3</text>
    <rect x="70" y="10" width="55" height="40" rx="5" fill="#f9e2af"/><text x="97" y="35" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">6</text>
    <rect x="140" y="5" width="55" height="45" rx="5" fill="#f9e2af"/><text x="167" y="33" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">7</text>
    <rect x="210" y="0" width="55" height="50" rx="5" fill="#f9e2af"/><text x="237" y="30" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">11</text>
  </g>

  <!-- Search range -->
  <g transform="translate(350, 78)">
    <text x="0" y="0" fill="#89b4fa" font-size="12" font-weight="bold">Binary Search Range:</text>
    <rect x="0" y="10" width="330" height="30" rx="6" fill="#313244" stroke="#585b70"/>
    <rect x="0" y="10" width="100" height="30" rx="6" fill="#45475a" stroke="#f9e2af"/>
    <text x="8" y="30" fill="#89b4fa" font-size="10">low=1</text>
    <text x="82" y="30" fill="#f9e2af" font-size="10" font-weight="bold">mid=3</text>
    <text x="290" y="30" fill="#f38ba8" font-size="10">high=5</text>
  </g>

  <!-- Step details -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="660" height="140" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="25" fill="#89b4fa" font-size="14" font-weight="bold">Iteration 2: Try k = 3 (speed: 3 bananas/hour)</text>
    <text x="15" y="50" fill="#a6adc8" font-size="12">mid = Math.ceil((1 + 5) / 2) = 3</text>

    <!-- Hour calculations -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="145" height="24" rx="4" fill="#45475a"/><text x="72" y="17" text-anchor="middle" fill="#f9e2af" font-size="10">⌈3/3⌉ = 1 hour</text>
      <rect x="155" y="0" width="145" height="24" rx="4" fill="#45475a"/><text x="227" y="17" text-anchor="middle" fill="#f9e2af" font-size="10">⌈6/3⌉ = 2 hours</text>
      <rect x="310" y="0" width="145" height="24" rx="4" fill="#45475a"/><text x="382" y="17" text-anchor="middle" fill="#f9e2af" font-size="10">⌈7/3⌉ = 3 hours</text>
      <rect x="465" y="0" width="145" height="24" rx="4" fill="#45475a"/><text x="537" y="17" text-anchor="middle" fill="#f9e2af" font-size="10">⌈11/3⌉ = 4 hours</text>
    </g>

    <text x="15" y="105" fill="#a6adc8" font-size="12">Total hours: 1 + 2 + 3 + 4 = <tspan fill="#f38ba8" font-weight="bold">10</tspan></text>
    <text x="15" y="128" fill="#f38ba8" font-size="13" font-weight="bold">10 &gt; 8 → Too slow! low = 4</text>
  </g>

  <!-- Progress -->
  <rect x="230" y="335" width="260" height="28" rx="14" fill="#313244" stroke="#45475a"/>
  <rect x="230" y="335" width="130" height="28" rx="14" fill="#89b4fa"/>
  <text x="360" y="354" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">Step 2 / 4</text>
</svg>
