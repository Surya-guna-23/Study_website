<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgvp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="750" height="400" rx="12" fill="url(#bgvp)"/>
  <text x="375" y="28" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Valid Palindrome — Dry Run</text>
  <text x="375" y="46" text-anchor="middle" fill="#6c7086" font-size="12">s = "A man, a plan, a canal: Panama"</text>

  <!-- Clean step -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="690" height="40" rx="6" fill="#313244" stroke="#f9e2af"/>
    <text x="15" y="25" fill="#f9e2af" font-size="12" font-weight="bold">Step 1: Clean → </text>
    <text x="115" y="25" fill="#a6e3a1" font-size="12" font-weight="bold">"amanaplanacanalpanama"</text>
    <text x="420" y="25" fill="#6c7086" font-size="11">(remove non-alphanumeric, lowercase)</text>
  </g>

  <!-- Cleaned string with pointers -->
  <text x="30" y="125" fill="#89b4fa" font-size="12" font-weight="bold">Two-pointer comparison:</text>
  <g transform="translate(30, 135)">
    <!-- Characters -->
    <rect x="0" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="15" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="33" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="48" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">m</text>
    <rect x="66" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="81" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="99" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="114" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">n</text>
    <rect x="132" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="147" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="165" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="180" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">p</text>
    <rect x="198" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="213" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">l</text>
    <rect x="231" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="246" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="264" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="279" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">n</text>
    <rect x="297" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="312" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="330" y="0" width="30" height="30" rx="4" fill="#f9e2af"/><text x="345" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">c</text>
    <rect x="363" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="378" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="396" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="411" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">n</text>
    <rect x="429" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="444" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="462" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="477" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">l</text>
    <rect x="495" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="510" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">p</text>
    <rect x="528" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="543" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="561" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="576" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">n</text>
    <rect x="594" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="609" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <rect x="627" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="642" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">m</text>
    <rect x="660" y="0" width="30" height="30" rx="4" fill="#a6e3a1"/><text x="675" y="21" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">a</text>
    <!-- Pointers -->
    <text x="15" y="50" text-anchor="middle" fill="#89b4fa" font-size="9" font-weight="bold">i→</text>
    <text x="675" y="50" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">←j</text>
    <!-- Center marker -->
    <text x="345" y="-8" text-anchor="middle" fill="#f9e2af" font-size="9">center</text>
  </g>

  <!-- Matching steps summary -->
  <g transform="translate(30, 210)">
    <rect x="0" y="0" width="690" height="130" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="22" fill="#89b4fa" font-size="13" font-weight="bold">Step 2: Compare from both ends, moving inward</text>
    
    <g transform="translate(15, 32)">
      <rect x="0" y="0" width="130" height="26" rx="4" fill="#45475a"/>
      <text x="65" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=0,j=20: a==a ✅</text>
      <rect x="140" y="0" width="130" height="26" rx="4" fill="#45475a"/>
      <text x="205" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=1,j=19: m==m ✅</text>
      <rect x="280" y="0" width="130" height="26" rx="4" fill="#45475a"/>
      <text x="345" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=2,j=18: a==a ✅</text>
      <rect x="420" y="0" width="130" height="26" rx="4" fill="#45475a"/>
      <text x="485" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=3,j=17: n==n ✅</text>
      <rect x="560" y="0" width="100" height="26" rx="4" fill="#45475a"/>
      <text x="610" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=4,j=16: a==a ✅</text>
    </g>
    <g transform="translate(15, 64)">
      <rect x="0" y="0" width="130" height="26" rx="4" fill="#45475a"/>
      <text x="65" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=5,j=15: p==p ✅</text>
      <rect x="140" y="0" width="130" height="26" rx="4" fill="#45475a"/>
      <text x="205" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=6,j=14: l==l ✅</text>
      <rect x="280" y="0" width="130" height="26" rx="4" fill="#45475a"/>
      <text x="345" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=7,j=13: a==a ✅</text>
      <rect x="420" y="0" width="130" height="26" rx="4" fill="#45475a"/>
      <text x="485" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=8,j=12: n==n ✅</text>
      <rect x="560" y="0" width="100" height="26" rx="4" fill="#45475a"/>
      <text x="610" y="18" text-anchor="middle" fill="#a6e3a1" font-size="10">i=9,j=11: a==a ✅</text>
    </g>
    <text x="15" y="112" fill="#a6e3a1" font-size="12" font-weight="bold">i=10, j=10 → i &lt; j is false → all matched! Exit loop.</text>
  </g>

  <rect x="245" y="358" width="260" height="32" rx="16" fill="#a6e3a1"/>
  <text x="375" y="379" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Output: true (palindrome) ✅</text>
</svg>