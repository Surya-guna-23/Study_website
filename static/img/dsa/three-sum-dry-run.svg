<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="780" height="540" rx="12" fill="url(#bg3s)"/>
  <text x="390" y="28" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">3Sum — Dry Run: nums = [-1, 0, 1, 2, -1, -4]</text>

  <!-- Sort step -->
  <g transform="translate(30, 45)">
    <text x="0" y="14" fill="#f9e2af" font-size="12" font-weight="bold">Step 1: Sort →</text>
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="42" height="28" rx="5" fill="#f38ba8"/><text x="21" y="20" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">-4</text>
      <rect x="48" y="0" width="42" height="28" rx="5" fill="#89b4fa"/><text x="69" y="20" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">-1</text>
      <rect x="96" y="0" width="42" height="28" rx="5" fill="#89b4fa"/><text x="117" y="20" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">-1</text>
      <rect x="144" y="0" width="42" height="28" rx="5" fill="#a6e3a1"/><text x="165" y="20" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">0</text>
      <rect x="192" y="0" width="42" height="28" rx="5" fill="#a6e3a1"/><text x="213" y="20" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">1</text>
      <rect x="240" y="0" width="42" height="28" rx="5" fill="#f9e2af"/><text x="261" y="20" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">2</text>
    </g>
  </g>

  <!-- i=0 -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="720" height="100" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="20" fill="#f38ba8" font-size="12" font-weight="bold">i=0, nums[0]=-4 → need j+k sum = 4</text>
    <text x="15" y="40" fill="#a6adc8" font-size="11">j=1(-1), k=5(2): total = -4+(-1)+2 = -3 &lt; 0 → j++</text>
    <text x="15" y="55" fill="#a6adc8" font-size="11">j=2(-1), k=5(2): total = -3 &lt; 0 → j++</text>
    <text x="15" y="70" fill="#a6adc8" font-size="11">j=3(0), k=5(2): total = -2 &lt; 0 → j++</text>
    <text x="15" y="85" fill="#a6adc8" font-size="11">j=4(1), k=5(2): total = -1 &lt; 0 → j++ → j≥k → done</text>
    <text x="580" y="50" fill="#6c7086" font-size="11">No triplets found</text>
  </g>

  <!-- i=1 -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="720" height="120" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="15" y="20" fill="#a6e3a1" font-size="12" font-weight="bold">i=1, nums[1]=-1 → need j+k sum = 1</text>
    
    <text x="15" y="42" fill="#a6e3a1" font-size="11">j=2(-1), k=5(2): total = -1+(-1)+2 = <tspan font-weight="bold">0 ✅ FOUND!</tspan></text>
    <rect x="400" y="28" width="200" height="22" rx="4" fill="#a6e3a1"/><text x="500" y="44" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">→ push [-1, -1, 2]</text>
    <text x="15" y="60" fill="#a6adc8" font-size="11">j++, k-- → skip duplicates</text>
    
    <text x="15" y="82" fill="#a6e3a1" font-size="11">j=3(0), k=4(1): total = -1+0+1 = <tspan font-weight="bold">0 ✅ FOUND!</tspan></text>
    <rect x="400" y="68" width="200" height="22" rx="4" fill="#a6e3a1"/><text x="500" y="84" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">→ push [-1, 0, 1]</text>
    <text x="15" y="100" fill="#a6adc8" font-size="11">j++, k-- → j=4, k=3 → j≥k → done</text>
  </g>

  <!-- i=2 -->
  <g transform="translate(30, 325)">
    <rect x="0" y="0" width="720" height="45" rx="8" fill="#313244" stroke="#f9e2af"/>
    <text x="15" y="28" fill="#f9e2af" font-size="12" font-weight="bold">i=2, nums[2]=-1 → same as nums[1] → SKIP (avoid duplicates)</text>
  </g>

  <!-- i=3 -->
  <g transform="translate(30, 380)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="20" fill="#a6adc8" font-size="12" font-weight="bold">i=3, nums[3]=0 → need j+k sum = 0</text>
    <text x="15" y="40" fill="#a6adc8" font-size="11">j=4(1), k=5(2): total = 0+1+2 = 3 &gt; 0 → k--</text>
    <text x="15" y="55" fill="#a6adc8" font-size="11">j=4, k=4 → j≥k → done. No triplets.</text>
  </g>

  <!-- Result -->
  <g transform="translate(30, 455)">
    <rect x="0" y="0" width="720" height="65" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <text x="360" y="22" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">Result:</text>
    <text x="360" y="48" text-anchor="middle" fill="#cdd6f4" font-size="14">[<tspan fill="#a6e3a1" font-weight="bold">[-1, -1, 2]</tspan>, <tspan fill="#a6e3a1" font-weight="bold">[-1, 0, 1]</tspan>] ✅</text>
  </g>
</svg>