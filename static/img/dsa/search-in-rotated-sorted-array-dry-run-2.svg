<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgsr2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="380" rx="12" fill="url(#bgsr2)"/>
  <text x="360" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Search in Rotated Sorted Array — Step 2 of 3</text>
  <text x="360" y="50" text-anchor="middle" fill="#6c7086" font-size="12">nums = [4, 5, 6, 7, 0, 1, 2], target = 0</text>

  <!-- Array -->
  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="39" y="28" text-anchor="middle" fill="#45475a" font-size="15">4</text>

    <rect x="86" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="125" y="28" text-anchor="middle" fill="#45475a" font-size="15">5</text>

    <rect x="172" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="211" y="28" text-anchor="middle" fill="#45475a" font-size="15">6</text>

    <rect x="258" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="297" y="28" text-anchor="middle" fill="#45475a" font-size="15">7</text>

    <rect x="344" y="0" width="78" height="44" rx="6" fill="#89b4fa"/>
    <text x="383" y="28" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">0</text>
    <text x="383" y="-8" text-anchor="middle" fill="#6c7086" font-size="10">4</text>

    <rect x="430" y="0" width="78" height="44" rx="6" fill="#f9e2af"/>
    <text x="469" y="28" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">1</text>
    <text x="469" y="-8" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">mid=5</text>

    <rect x="516" y="0" width="78" height="44" rx="6" fill="#313244" stroke="#585b70"/>
    <text x="555" y="28" text-anchor="middle" fill="#a6adc8" font-size="15">2</text>
    <text x="555" y="-8" text-anchor="middle" fill="#6c7086" font-size="10">6</text>

    <!-- Pointers -->
    <text x="383" y="62" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">low</text>
    <text x="555" y="62" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">high</text>

    <!-- Sorted bracket -->
    <line x1="344" y1="-22" x2="508" y2="-22" stroke="#89b4fa" stroke-width="2"/>
    <text x="426" y="-26" text-anchor="middle" fill="#89b4fa" font-size="9">left half sorted [0,1]</text>
  </g>

  <!-- Step details -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="660" height="130" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="25" fill="#89b4fa" font-size="14" font-weight="bold">Iteration 2</text>
    <text x="15" y="48" fill="#a6adc8" font-size="12">mid = Math.ceil((4 + 6) / 2) = 5, nums[5] = 1 ≠ target(0)</text>
    <text x="15" y="70" fill="#a6adc8" font-size="12">nums[low] (0) ≤ nums[mid] (1) → <tspan fill="#89b4fa">Left half [0,1] is sorted</tspan></text>
    <text x="15" y="92" fill="#a6adc8" font-size="12">Is target (0) in [0, 1]? → 0 ≤ 0 ≤ 1? <tspan fill="#a6e3a1" font-weight="bold">YES</tspan></text>
    <text x="15" y="114" fill="#f9e2af" font-size="13" font-weight="bold">Target IS in sorted half → Search LEFT: high = mid - 1 = 4</text>

    <text x="580" y="60" fill="#f9e2af" font-size="30">←</text>
    <text x="575" y="85" fill="#6c7086" font-size="11">go left</text>
  </g>

  <!-- Progress -->
  <rect x="230" y="330" width="260" height="28" rx="14" fill="#313244" stroke="#45475a"/>
  <rect x="230" y="330" width="174" height="28" rx="14" fill="#89b4fa"/>
  <text x="360" y="348" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">Step 2 / 3</text>
</svg>
