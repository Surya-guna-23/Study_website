<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgfm2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="380" rx="12" fill="url(#bgfm2)"/>
  <text x="360" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Find Min in Rotated Sorted Array — Step 2 of 2</text>
  <text x="360" y="50" text-anchor="middle" fill="#6c7086" font-size="12">nums = [3, 4, 5, 1, 2]</text>

  <!-- Array visualization -->
  <g transform="translate(85, 75)">
    <rect x="0" y="0" width="90" height="48" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="45" y="30" text-anchor="middle" fill="#45475a" font-size="16">3</text>

    <rect x="100" y="0" width="90" height="48" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="145" y="30" text-anchor="middle" fill="#45475a" font-size="16">4</text>

    <rect x="200" y="0" width="90" height="48" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="245" y="30" text-anchor="middle" fill="#45475a" font-size="16">5</text>

    <rect x="300" y="0" width="90" height="48" rx="6" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="2"/>
    <text x="345" y="30" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">1</text>
    <text x="345" y="-10" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">low=3 ★</text>

    <rect x="400" y="0" width="90" height="48" rx="6" fill="#313244" stroke="#585b70"/>
    <text x="445" y="30" text-anchor="middle" fill="#a6adc8" font-size="16">2</text>
    <text x="445" y="-10" text-anchor="middle" fill="#6c7086" font-size="10">high=4</text>

    <!-- mid pointer -->
    <text x="445" y="66" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">mid=4</text>

    <!-- Sorted bracket -->
    <line x1="300" y1="-22" x2="490" y2="-22" stroke="#a6e3a1" stroke-width="2"/>
    <text x="395" y="-26" text-anchor="middle" fill="#a6e3a1" font-size="9">fully sorted</text>
  </g>

  <!-- Step details -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="660" height="120" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <text x="15" y="25" fill="#a6e3a1" font-size="14" font-weight="bold">Iteration 2 — FOUND MINIMUM!</text>
    <text x="15" y="48" fill="#a6adc8" font-size="12">mid = Math.ceil((3 + 4) / 2) = 4</text>
    <text x="15" y="68" fill="#a6adc8" font-size="12">nums[low] (1) ≤ nums[high] (2) → <tspan fill="#a6e3a1" font-weight="bold">Sub-array is FULLY sorted!</tspan></text>
    <text x="15" y="90" fill="#a6e3a1" font-size="12">ans = Math.min(3, nums[low]) = Math.min(3, 1) = <tspan font-weight="bold" font-size="14">1</tspan></text>
    <text x="15" y="112" fill="#a6e3a1" font-size="13" font-weight="bold">Break! Return ans = 1 ✅</text>

    <text x="600" y="75" fill="#a6e3a1" font-size="48">✓</text>
  </g>

  <!-- Result -->
  <rect x="230" y="320" width="260" height="38" rx="19" fill="#a6e3a1"/>
  <text x="360" y="344" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">Output: 1</text>
</svg>
