<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgrn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="750" height="420" rx="12" fill="url(#bgrn)"/>
  <text x="375" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Remove Nth Node From End — Dry Run: [1,2,3,4,5], n=2</text>

  <!-- Original list -->
  <text x="30" y="60" fill="#89b4fa" font-size="12" font-weight="bold">List: 1 → 2 → 3 → 4 → 5</text>

  <!-- Phase 1 -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="690" height="100" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="22" fill="#f9e2af" font-size="13" font-weight="bold">Phase 1: Move fast pointer n=2 steps ahead</text>
    <g transform="translate(40, 35)">
      <rect x="0" y="0" width="45" height="32" rx="6" fill="#89b4fa"/><text x="22" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">1</text>
      <rect x="55" y="0" width="45" height="32" rx="6" fill="#89b4fa"/><text x="77" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">2</text>
      <rect x="110" y="0" width="45" height="32" rx="6" fill="#f9e2af"/><text x="132" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">3</text>
      <rect x="165" y="0" width="45" height="32" rx="6" fill="#313244" stroke="#585b70"/><text x="187" y="22" text-anchor="middle" fill="#cdd6f4" font-size="14">4</text>
      <rect x="220" y="0" width="45" height="32" rx="6" fill="#313244" stroke="#585b70"/><text x="242" y="22" text-anchor="middle" fill="#cdd6f4" font-size="14">5</text>
      <!-- Pointers -->
      <text x="22" y="52" text-anchor="middle" fill="#cba6f7" font-size="10" font-weight="bold">slow</text>
      <text x="132" y="52" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">fast</text>
      <text x="300" y="20" fill="#6c7086" font-size="11">fast is 2 steps ahead of slow</text>
    </g>
  </g>

  <!-- Phase 2 -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="690" height="120" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="22" fill="#f9e2af" font-size="13" font-weight="bold">Phase 2: Move both until fast.next === null</text>
    <!-- Step by step -->
    <g transform="translate(40, 32)">
      <!-- Row 1 -->
      <text x="0" y="15" fill="#6c7086" font-size="11">Move 1:</text>
      <rect x="70" y="0" width="40" height="24" rx="4" fill="#313244" stroke="#585b70"/><text x="90" y="17" text-anchor="middle" fill="#cdd6f4" font-size="11">1</text>
      <rect x="115" y="0" width="40" height="24" rx="4" fill="#cba6f7"/><text x="135" y="17" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">2</text>
      <rect x="160" y="0" width="40" height="24" rx="4" fill="#313244" stroke="#585b70"/><text x="180" y="17" text-anchor="middle" fill="#cdd6f4" font-size="11">3</text>
      <rect x="205" y="0" width="40" height="24" rx="4" fill="#f9e2af"/><text x="225" y="17" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">4</text>
      <rect x="250" y="0" width="40" height="24" rx="4" fill="#313244" stroke="#585b70"/><text x="270" y="17" text-anchor="middle" fill="#cdd6f4" font-size="11">5</text>
      <text x="310" y="16" fill="#cba6f7" font-size="10">slow=2</text>
      <text x="310" y="28" fill="#f9e2af" font-size="10">fast=4</text>
    </g>
    <g transform="translate(40, 62)">
      <!-- Row 2 -->
      <text x="0" y="15" fill="#6c7086" font-size="11">Move 2:</text>
      <rect x="70" y="0" width="40" height="24" rx="4" fill="#313244" stroke="#585b70"/><text x="90" y="17" text-anchor="middle" fill="#cdd6f4" font-size="11">1</text>
      <rect x="115" y="0" width="40" height="24" rx="4" fill="#313244" stroke="#585b70"/><text x="135" y="17" text-anchor="middle" fill="#cdd6f4" font-size="11">2</text>
      <rect x="160" y="0" width="40" height="24" rx="4" fill="#cba6f7"/><text x="180" y="17" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">3</text>
      <rect x="205" y="0" width="40" height="24" rx="4" fill="#313244" stroke="#585b70"/><text x="225" y="17" text-anchor="middle" fill="#cdd6f4" font-size="11">4</text>
      <rect x="250" y="0" width="40" height="24" rx="4" fill="#f9e2af"/><text x="270" y="17" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">5</text>
      <text x="310" y="16" fill="#cba6f7" font-size="10">slow=3</text>
      <text x="310" y="28" fill="#f9e2af" font-size="10">fast=5 (fast.next=null → stop)</text>
    </g>
  </g>

  <!-- Phase 3 -->
  <g transform="translate(30, 315)">
    <rect x="0" y="0" width="690" height="55" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="15" y="22" fill="#a6e3a1" font-size="13" font-weight="bold">Phase 3: Remove — slow.next = slow.next.next</text>
    <text x="15" y="42" fill="#a6adc8" font-size="12">slow(3).next was 4, now skip to 5 → node 4 removed!</text>
  </g>

  <!-- Result -->
  <text x="30" y="397" fill="#a6e3a1" font-size="13" font-weight="bold">Result:</text>
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="45" height="30" rx="6" fill="#a6e3a1"/><text x="22" y="21" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">1</text>
    <text x="50" y="21" fill="#a6e3a1" font-size="13">→</text>
    <rect x="62" y="0" width="45" height="30" rx="6" fill="#a6e3a1"/><text x="84" y="21" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">2</text>
    <text x="112" y="21" fill="#a6e3a1" font-size="13">→</text>
    <rect x="124" y="0" width="45" height="30" rx="6" fill="#a6e3a1"/><text x="146" y="21" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">3</text>
    <text x="174" y="21" fill="#a6e3a1" font-size="13">→</text>
    <rect x="186" y="0" width="45" height="30" rx="6" fill="#f38ba8" stroke="#f38ba8" stroke-dasharray="4,2" opacity="0.3"/><text x="208" y="21" text-anchor="middle" fill="#f38ba8" font-size="13" text-decoration="line-through">4</text>
    <text x="236" y="21" fill="#6c7086" font-size="11">skipped</text>
    <text x="290" y="21" fill="#a6e3a1" font-size="13">→</text>
    <rect x="302" y="0" width="45" height="30" rx="6" fill="#a6e3a1"/><text x="324" y="21" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">5</text>
    <text x="360" y="21" fill="#a6e3a1" font-size="12"> ✅ [1,2,3,5]</text>
  </g>
</svg>