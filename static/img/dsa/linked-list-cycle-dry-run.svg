<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
    <marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#89b4fa"/></marker>
  </defs>
  <rect width="720" height="450" rx="12" fill="url(#bg8)"/>
  <text x="360" y="32" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Linked List Cycle — Floyd's Tortoise &amp; Hare</text>
  <text x="360" y="52" text-anchor="middle" fill="#6c7086" font-size="13">[3, 2, 0, -4] → tail connects to index 1</text>

  <!-- Linked list with cycle visual -->
  <g transform="translate(120, 70)">
    <circle cx="0" cy="30" r="24" fill="#89b4fa"/><text x="0" y="36" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">3</text>
    <line x1="24" y1="30" x2="96" y2="30" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr8)"/>
    <circle cx="120" cy="30" r="24" fill="#f9e2af"/><text x="120" y="36" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">2</text>
    <line x1="144" y1="30" x2="216" y2="30" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr8)"/>
    <circle cx="240" cy="30" r="24" fill="#89b4fa"/><text x="240" y="36" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">0</text>
    <line x1="264" y1="30" x2="336" y2="30" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr8)"/>
    <circle cx="360" cy="30" r="24" fill="#89b4fa"/><text x="360" y="36" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">-4</text>
    <!-- Cycle arrow -->
    <path d="M 360 54 Q 360 90 240 90 Q 120 90 120 54" stroke="#f38ba8" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arr8)"/>
    <text x="240" y="108" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">cycle back to node 2</text>
  </g>

  <!-- Step tracking table -->
  <g transform="translate(30, 195)">
    <!-- Header -->
    <rect x="0" y="0" width="660" height="32" rx="6" fill="#45475a"/>
    <text x="50" y="22" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">Step</text>
    <text x="180" y="22" text-anchor="middle" fill="#f38ba8" font-size="12" font-weight="bold">🐢 Slow</text>
    <text x="360" y="22" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">🐇 Fast</text>
    <text x="540" y="22" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">Meet?</text>

    <!-- Step 0 -->
    <rect x="0" y="38" width="660" height="32" rx="0" fill="#313244"/>
    <text x="50" y="58" text-anchor="middle" fill="#6c7086" font-size="12">Start</text>
    <text x="180" y="58" text-anchor="middle" fill="#f38ba8" font-size="13">3</text>
    <text x="360" y="58" text-anchor="middle" fill="#89b4fa" font-size="13">3</text>
    <text x="540" y="58" text-anchor="middle" fill="#6c7086" font-size="12">—</text>

    <!-- Step 1 -->
    <rect x="0" y="74" width="660" height="32" rx="0" fill="#2a2a3c"/>
    <text x="50" y="94" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>
    <text x="180" y="94" text-anchor="middle" fill="#f38ba8" font-size="13" font-weight="bold">2</text>
    <text x="360" y="94" text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="bold">0</text>
    <text x="540" y="94" text-anchor="middle" fill="#f38ba8" font-size="12">No</text>

    <!-- Step 2 -->
    <rect x="0" y="110" width="660" height="32" rx="0" fill="#313244"/>
    <text x="50" y="130" text-anchor="middle" fill="#cdd6f4" font-size="12">2</text>
    <text x="180" y="130" text-anchor="middle" fill="#f38ba8" font-size="13" font-weight="bold">0</text>
    <text x="360" y="130" text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="bold">2</text>
    <text x="540" y="130" text-anchor="middle" fill="#f38ba8" font-size="12">No</text>

    <!-- Step 3 -->
    <rect x="0" y="146" width="660" height="32" rx="0" fill="#2a2a3c"/>
    <text x="50" y="166" text-anchor="middle" fill="#cdd6f4" font-size="12">3</text>
    <text x="180" y="166" text-anchor="middle" fill="#f38ba8" font-size="13" font-weight="bold">-4</text>
    <text x="360" y="166" text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="bold">0</text>
    <text x="540" y="166" text-anchor="middle" fill="#f38ba8" font-size="12">No</text>

    <!-- Step 4 - MEET! -->
    <rect x="0" y="182" width="660" height="36" rx="0" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="50" y="205" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">4</text>
    <text x="180" y="205" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">2</text>
    <text x="360" y="205" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">2</text>
    <text x="540" y="205" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">YES! ✅</text>
  </g>

  <!-- Result -->
  <rect x="200" y="405" width="320" height="34" rx="17" fill="#a6e3a1"/>
  <text x="360" y="427" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Cycle detected → return true ✅</text>
</svg>