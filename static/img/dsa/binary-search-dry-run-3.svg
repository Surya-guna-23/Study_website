<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="370" rx="12" fill="url(#bg3)"/>
  <text x="360" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Binary Search — Step 3 of 3</text>
  <text x="360" y="50" text-anchor="middle" fill="#6c7086" font-size="12">nums = [-1, 0, 3, 5, 9, 12], target = 9</text>

  <!-- Array -->
  <g transform="translate(85, 75)">
    <rect x="0" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="37" y="28" text-anchor="middle" fill="#45475a" font-size="15">-1</text>

    <rect x="85" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="122" y="28" text-anchor="middle" fill="#45475a" font-size="15">0</text>

    <rect x="170" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="207" y="28" text-anchor="middle" fill="#45475a" font-size="15">3</text>

    <rect x="255" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="292" y="28" text-anchor="middle" fill="#45475a" font-size="15">5</text>

    <rect x="340" y="0" width="75" height="44" rx="6" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="2"/>
    <text x="377" y="28" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">9</text>
    <text x="377" y="-8" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">mid=4 ✓</text>

    <rect x="425" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="462" y="28" text-anchor="middle" fill="#45475a" font-size="15">12</text>

    <!-- Pointers -->
    <text x="377" y="62" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">low = high</text>
  </g>

  <!-- Step details -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="660" height="110" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <text x="15" y="25" fill="#a6e3a1" font-size="14" font-weight="bold">Call 3: helper(nums, 4, 4, 9) — FOUND!</text>
    <text x="15" y="50" fill="#a6adc8" font-size="12">mid = Math.ceil((4 + 4) / 2) = 4</text>
    <text x="15" y="70" fill="#a6adc8" font-size="12">nums[4] = 9</text>
    <text x="15" y="95" fill="#a6e3a1" font-size="14" font-weight="bold">nums[mid] === target → Return 4 ✅</text>

    <!-- Checkmark -->
    <text x="600" y="65" fill="#a6e3a1" font-size="48">✓</text>
  </g>

  <!-- Result -->
  <rect x="230" y="310" width="260" height="38" rx="19" fill="#a6e3a1"/>
  <text x="360" y="334" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">Output: 4</text>
</svg>
