<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="740" height="520" rx="12" fill="url(#bg5)"/>
  <text x="370" y="32" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Top K Frequent Elements — Dry Run: nums=[1,1,1,2,2,3], k=2</text>

  <!-- Input Array -->
  <text x="30" y="60" fill="#89b4fa" font-size="13" font-weight="bold">Input Array:</text>
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="42" height="34" rx="5" fill="#89b4fa"/><text x="21" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">1</text>
    <rect x="48" y="0" width="42" height="34" rx="5" fill="#89b4fa"/><text x="69" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">1</text>
    <rect x="96" y="0" width="42" height="34" rx="5" fill="#89b4fa"/><text x="117" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">1</text>
    <rect x="144" y="0" width="42" height="34" rx="5" fill="#cba6f7"/><text x="165" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">2</text>
    <rect x="192" y="0" width="42" height="34" rx="5" fill="#cba6f7"/><text x="213" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">2</text>
    <rect x="240" y="0" width="42" height="34" rx="5" fill="#f38ba8"/><text x="261" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">3</text>
  </g>

  <!-- Phase 1: Build Frequency Map -->
  <text x="30" y="128" fill="#f9e2af" font-size="14" font-weight="bold">Phase 1: Build Frequency Map</text>
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="680" height="120" rx="8" fill="#313244" stroke="#45475a"/>
    <!-- Iteration bubbles -->
    <text x="20" y="25" fill="#6c7086" font-size="11">Iterating through array:</text>
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="90" height="28" rx="4" fill="#45475a"/><text x="45" y="19" text-anchor="middle" fill="#89b4fa" font-size="11">1 → {1:1}</text>
      <rect x="100" y="0" width="90" height="28" rx="4" fill="#45475a"/><text x="145" y="19" text-anchor="middle" fill="#89b4fa" font-size="11">1 → {1:2}</text>
      <rect x="200" y="0" width="90" height="28" rx="4" fill="#45475a"/><text x="245" y="19" text-anchor="middle" fill="#89b4fa" font-size="11">1 → {1:3}</text>
      <rect x="300" y="0" width="110" height="28" rx="4" fill="#45475a"/><text x="355" y="19" text-anchor="middle" fill="#cba6f7" font-size="11">2 → {1:3, 2:1}</text>
      <rect x="420" y="0" width="110" height="28" rx="4" fill="#45475a"/><text x="475" y="19" text-anchor="middle" fill="#cba6f7" font-size="11">2 → {1:3, 2:2}</text>
      <rect x="540" y="0" width="120" height="28" rx="4" fill="#45475a"/><text x="600" y="19" text-anchor="middle" fill="#f38ba8" font-size="11">3 → {1:3, 2:2, 3:1}</text>
    </g>
    <!-- Final map -->
    <text x="20" y="88" fill="#a6e3a1" font-size="12" font-weight="bold">Final Frequency Map:</text>
    <rect x="220" y="72" width="80" height="36" rx="6" fill="#89b4fa"/><text x="260" y="96" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">1 → 3</text>
    <rect x="310" y="72" width="80" height="36" rx="6" fill="#cba6f7"/><text x="350" y="96" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">2 → 2</text>
    <rect x="400" y="72" width="80" height="36" rx="6" fill="#f38ba8"/><text x="440" y="96" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">3 → 1</text>
  </g>

  <!-- Phase 2: Sort by Frequency -->
  <text x="30" y="290" fill="#f9e2af" font-size="14" font-weight="bold">Phase 2: Sort by Frequency (Descending)</text>
  <g transform="translate(30, 302)">
    <rect x="0" y="0" width="680" height="80" rx="8" fill="#313244" stroke="#45475a"/>
    <!-- Sorted entries -->
    <text x="20" y="25" fill="#6c7086" font-size="11">Sorted entries:</text>
    <!-- 1st place -->
    <rect x="20" y="35" width="200" height="34" rx="6" fill="#89b4fa"/>
    <text x="30" y="57" fill="#1e1e2e" font-size="13" font-weight="bold">🥇 [1, 3]</text>
    <text x="150" y="57" fill="#1e1e2e" font-size="11">freq = 3</text>
    <!-- 2nd place -->
    <rect x="240" y="35" width="200" height="34" rx="6" fill="#cba6f7"/>
    <text x="250" y="57" fill="#1e1e2e" font-size="13" font-weight="bold">🥈 [2, 2]</text>
    <text x="370" y="57" fill="#1e1e2e" font-size="11">freq = 2</text>
    <!-- 3rd place -->
    <rect x="460" y="35" width="200" height="34" rx="6" fill="#45475a" stroke="#f38ba8"/>
    <text x="470" y="57" fill="#f38ba8" font-size="13">🥉 [3, 1]</text>
    <text x="590" y="57" fill="#6c7086" font-size="11">freq = 1</text>
  </g>

  <!-- Phase 3: Slice top k -->
  <text x="30" y="412" fill="#f9e2af" font-size="14" font-weight="bold">Phase 3: Slice top k=2 and extract keys</text>
  <g transform="translate(30, 424)">
    <rect x="0" y="0" width="680" height="45" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="20" y="28" fill="#a6adc8" font-size="12">sorted.slice(0, 2) → [[1,3], [2,2]] → .map(([key]) =&gt; key) → </text>
    <text x="500" y="28" fill="#a6e3a1" font-size="13" font-weight="bold">[1, 2]</text>
  </g>

  <!-- Result -->
  <rect x="240" y="480" width="260" height="30" rx="15" fill="#a6e3a1"/>
  <text x="370" y="500" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Output: [1, 2] ✅</text>
</svg>