<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="720" height="520" rx="12" fill="url(#bg1)"/>
  <text x="360" y="35" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">Contains Duplicate — Dry Run: nums = [1, 2, 3, 1]</text>
  
  <!-- Input Array -->
  <text x="30" y="70" fill="#89b4fa" font-size="13" font-weight="bold">Input Array:</text>
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="50" height="40" rx="6" fill="#313244" stroke="#585b70" stroke-width="1.5" filter="url(#shadow1)"/>
    <text x="25" y="26" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">1</text>
    <text x="25" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=0</text>
    <rect x="60" y="0" width="50" height="40" rx="6" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="85" y="26" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">2</text>
    <text x="85" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=1</text>
    <rect x="120" y="0" width="50" height="40" rx="6" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="145" y="26" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">3</text>
    <text x="145" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=2</text>
    <rect x="180" y="0" width="50" height="40" rx="6" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="205" y="26" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">1</text>
    <text x="205" y="-6" text-anchor="middle" fill="#a6e3a1" font-size="10">i=3 ✓</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(30, 155)">
    <rect x="0" y="0" width="660" height="65" rx="8" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <text x="15" y="20" fill="#89b4fa" font-size="12" font-weight="bold">Step 1: i=0, nums[0]=1</text>
    <rect x="15" y="30" width="40" height="26" rx="4" fill="#89b4fa"/>
    <text x="35" y="48" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">1</text>
    <text x="65" y="48" fill="#a6adc8" font-size="12">→ Set has 1? No → Add to Set</text>
    <text x="350" y="20" fill="#6c7086" font-size="12">Set:</text>
    <rect x="385" y="5" width="60" height="26" rx="13" fill="#45475a" stroke="#89b4fa" stroke-width="1"/>
    <text x="415" y="23" text-anchor="middle" fill="#89b4fa" font-size="12">{ 1 }</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="660" height="65" rx="8" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <text x="15" y="20" fill="#89b4fa" font-size="12" font-weight="bold">Step 2: i=1, nums[1]=2</text>
    <rect x="15" y="30" width="40" height="26" rx="4" fill="#89b4fa"/>
    <text x="35" y="48" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">2</text>
    <text x="65" y="48" fill="#a6adc8" font-size="12">→ Set has 2? No → Add to Set</text>
    <text x="350" y="20" fill="#6c7086" font-size="12">Set:</text>
    <rect x="385" y="5" width="90" height="26" rx="13" fill="#45475a" stroke="#89b4fa" stroke-width="1"/>
    <text x="430" y="23" text-anchor="middle" fill="#89b4fa" font-size="12">{ 1, 2 }</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(30, 305)">
    <rect x="0" y="0" width="660" height="65" rx="8" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <text x="15" y="20" fill="#89b4fa" font-size="12" font-weight="bold">Step 3: i=2, nums[2]=3</text>
    <rect x="15" y="30" width="40" height="26" rx="4" fill="#89b4fa"/>
    <text x="35" y="48" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">3</text>
    <text x="65" y="48" fill="#a6adc8" font-size="12">→ Set has 3? No → Add to Set</text>
    <text x="350" y="20" fill="#6c7086" font-size="12">Set:</text>
    <rect x="385" y="5" width="120" height="26" rx="13" fill="#45475a" stroke="#89b4fa" stroke-width="1"/>
    <text x="445" y="23" text-anchor="middle" fill="#89b4fa" font-size="12">{ 1, 2, 3 }</text>
  </g>

  <!-- Step 4 - Found! -->
  <g transform="translate(30, 380)">
    <rect x="0" y="0" width="660" height="65" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <text x="15" y="20" fill="#a6e3a1" font-size="12" font-weight="bold">Step 4: i=3, nums[3]=1 — DUPLICATE FOUND!</text>
    <rect x="15" y="30" width="40" height="26" rx="4" fill="#f38ba8"/>
    <text x="35" y="48" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">1</text>
    <text x="65" y="48" fill="#a6e3a1" font-size="12">→ Set has 1? YES → Return true ✅</text>
    <text x="350" y="20" fill="#6c7086" font-size="12">Set:</text>
    <rect x="385" y="5" width="120" height="26" rx="13" fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="445" y="23" text-anchor="middle" fill="#a6e3a1" font-size="12">{ 1, 2, 3 }</text>
  </g>

  <!-- Result -->
  <rect x="230" y="465" width="260" height="38" rx="19" fill="#a6e3a1"/>
  <text x="360" y="490" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">Output: true (duplicate 1)</text>
</svg>