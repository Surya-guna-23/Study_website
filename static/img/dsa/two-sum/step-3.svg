<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="ts2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/><stop offset="100%" style="stop-color:#1e3a2f"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="12" fill="url(#ts2)"/>
  <text x="360" y="40" text-anchor="middle" fill="#a6e3a1" font-size="18" font-weight="bold">Step 2 — i = 1, nums[1] = 7 → FOUND!</text>

  <g transform="translate(110, 65)">
    <rect x="0" y="0" width="60" height="42" rx="6" fill="#a6e3a1"/><text x="30" y="27" text-anchor="middle" fill="#1e1e2e" font-size="17" font-weight="bold">2</text><text x="30" y="-8" text-anchor="middle" fill="#a6e3a1" font-size="11">match</text>
    <rect x="70" y="0" width="60" height="42" rx="6" fill="#89b4fa"/><text x="100" y="27" text-anchor="middle" fill="#1e1e2e" font-size="17" font-weight="bold">7</text><text x="100" y="-8" text-anchor="middle" fill="#89b4fa" font-size="11">i=1 ◄</text>
    <rect x="140" y="0" width="60" height="42" rx="6" fill="#313244" stroke="#585b70"/><text x="170" y="27" text-anchor="middle" fill="#6c7086" font-size="17">11</text>
    <rect x="210" y="0" width="60" height="42" rx="6" fill="#313244" stroke="#585b70"/><text x="240" y="27" text-anchor="middle" fill="#6c7086" font-size="17">15</text>
  </g>

  <rect x="30" y="135" width="400" height="130" rx="10" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
  <text x="50" y="165" fill="#a6e3a1" font-size="14" font-weight="bold">complement = 9 − 7 = 2</text>
  <text x="50" y="193" fill="#a6e3a1" font-size="14">map.has(2)? → YES! found at index 0</text>
  <text x="50" y="228" fill="#a6e3a1" font-size="15" font-weight="bold">return [0, 1] ✅</text>

  <text x="470" y="150" fill="#6c7086" font-size="13">Map:</text>
  <rect x="470" y="160" width="150" height="46" rx="8" fill="#45475a" stroke="#a6e3a1"/>
  <text x="545" y="189" text-anchor="middle" fill="#a6e3a1" font-size="15" font-weight="bold">2 → 0</text>

  <rect x="230" y="272" width="260" height="20" rx="10" fill="#a6e3a1"/>
  <text x="360" y="287" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">Output: [0, 1]</text>
</svg>
