<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="ts0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/><stop offset="100%" style="stop-color:#2d2d44"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="12" fill="url(#ts0)"/>
  <text x="360" y="40" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">Two Sum — Setup</text>

  <text x="30" y="90" fill="#89b4fa" font-size="14" font-weight="bold">nums:</text>
  <g transform="translate(110, 70)">
    <rect x="0" y="0" width="60" height="42" rx="6" fill="#313244" stroke="#585b70"/><text x="30" y="27" text-anchor="middle" fill="#cdd6f4" font-size="17">2</text><text x="30" y="-8" text-anchor="middle" fill="#6c7086" font-size="11">i=0</text>
    <rect x="70" y="0" width="60" height="42" rx="6" fill="#313244" stroke="#585b70"/><text x="100" y="27" text-anchor="middle" fill="#cdd6f4" font-size="17">7</text><text x="100" y="-8" text-anchor="middle" fill="#6c7086" font-size="11">i=1</text>
    <rect x="140" y="0" width="60" height="42" rx="6" fill="#313244" stroke="#585b70"/><text x="170" y="27" text-anchor="middle" fill="#cdd6f4" font-size="17">11</text><text x="170" y="-8" text-anchor="middle" fill="#6c7086" font-size="11">i=2</text>
    <rect x="210" y="0" width="60" height="42" rx="6" fill="#313244" stroke="#585b70"/><text x="240" y="27" text-anchor="middle" fill="#cdd6f4" font-size="17">15</text><text x="240" y="-8" text-anchor="middle" fill="#6c7086" font-size="11">i=3</text>
  </g>

  <rect x="430" y="70" width="180" height="42" rx="8" fill="#45475a"/>
  <text x="520" y="97" text-anchor="middle" fill="#f9e2af" font-size="16" font-weight="bold">target = 9</text>

  <rect x="30" y="150" width="660" height="110" rx="10" fill="#313244" stroke="#45475a"/>
  <text x="50" y="180" fill="#a6adc8" font-size="14">Idea: keep a map of value → index.</text>
  <text x="50" y="208" fill="#a6adc8" font-size="14">For each nums[i], check if (target − nums[i]) is already in the map.</text>
  <text x="50" y="236" fill="#a6e3a1" font-size="14">If yes → we found the pair. Otherwise store nums[i] and move on.</text>
</svg>
