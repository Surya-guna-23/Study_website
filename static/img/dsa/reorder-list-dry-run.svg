<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 440" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgrl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="750" height="440" rx="12" fill="url(#bgrl)"/>
  <text x="375" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Reorder List — Dry Run: [1, 2, 3, 4]</text>

  <!-- Original -->
  <text x="30" y="60" fill="#89b4fa" font-size="12" font-weight="bold">Original: 1 → 2 → 3 → 4</text>
  <text x="30" y="80" fill="#f9e2af" font-size="12" font-weight="bold">Stack (nodes after head): [2, 3, 4]</text>

  <!-- Step 1 -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="690" height="90" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="22" fill="#89b4fa" font-size="13" font-weight="bold">Step 1: curr=1, pop last=4</text>
    <text x="15" y="42" fill="#a6adc8" font-size="12">next = curr.next (2) → insert 4 between 1 and 2</text>
    <text x="15" y="62" fill="#a6adc8" font-size="12">1.next = 4, 4.next = 2, curr moves to 2</text>
    <text x="15" y="82" fill="#a6e3a1" font-size="12">List: <tspan fill="#89b4fa" font-weight="bold">1</tspan> → <tspan fill="#f9e2af" font-weight="bold">4</tspan> → <tspan fill="#89b4fa">2</tspan> → <tspan fill="#6c7086">3</tspan></text>
    <!-- Stack visual -->
    <g transform="translate(500, 10)">
      <text x="0" y="12" fill="#6c7086" font-size="10">Stack:</text>
      <rect x="0" y="18" width="40" height="24" rx="4" fill="#45475a" stroke="#cba6f7"/><text x="20" y="34" text-anchor="middle" fill="#cba6f7" font-size="11">2</text>
      <rect x="45" y="18" width="40" height="24" rx="4" fill="#45475a" stroke="#cba6f7"/><text x="65" y="34" text-anchor="middle" fill="#cba6f7" font-size="11">3</text>
      <rect x="90" y="18" width="50" height="24" rx="4" fill="#45475a" stroke="#6c7086" stroke-dasharray="3,2"/><text x="115" y="34" text-anchor="middle" fill="#6c7086" font-size="11">4 ←pop</text>
    </g>
  </g>

  <!-- Step 2 -->
  <g transform="translate(30, 200)">
    <rect x="0" y="0" width="690" height="90" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="15" y="22" fill="#a6e3a1" font-size="13" font-weight="bold">Step 2: curr=2, pop last=3 → curr.next === last → STOP</text>
    <text x="15" y="42" fill="#a6adc8" font-size="12">curr.next (3) === last (3) → set 3.next = null, break</text>
    <text x="15" y="62" fill="#a6adc8" font-size="12">This is the middle → stop interleaving</text>
    <text x="15" y="82" fill="#a6e3a1" font-size="12" font-weight="bold">List: 1 → 4 → 2 → 3 → null</text>
    <g transform="translate(500, 10)">
      <text x="0" y="12" fill="#6c7086" font-size="10">Stack:</text>
      <rect x="0" y="18" width="40" height="24" rx="4" fill="#45475a" stroke="#6c7086" stroke-dasharray="3,2"/><text x="20" y="34" text-anchor="middle" fill="#6c7086" font-size="11">2</text>
      <rect x="45" y="18" width="50" height="24" rx="4" fill="#45475a" stroke="#6c7086" stroke-dasharray="3,2"/><text x="70" y="34" text-anchor="middle" fill="#6c7086" font-size="11">3 ←pop</text>
    </g>
  </g>

  <!-- Final result visual -->
  <text x="30" y="325" fill="#a6e3a1" font-size="14" font-weight="bold">Final Result:</text>
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="60" height="45" rx="8" fill="#89b4fa"/><text x="30" y="28" text-anchor="middle" fill="#1e1e2e" font-size="18" font-weight="bold">1</text>
    <text x="70" y="28" fill="#a6e3a1" font-size="18">→</text>
    <rect x="90" y="0" width="60" height="45" rx="8" fill="#f9e2af"/><text x="120" y="28" text-anchor="middle" fill="#1e1e2e" font-size="18" font-weight="bold">4</text>
    <text x="160" y="28" fill="#a6e3a1" font-size="18">→</text>
    <rect x="180" y="0" width="60" height="45" rx="8" fill="#89b4fa"/><text x="210" y="28" text-anchor="middle" fill="#1e1e2e" font-size="18" font-weight="bold">2</text>
    <text x="250" y="28" fill="#a6e3a1" font-size="18">→</text>
    <rect x="270" y="0" width="60" height="45" rx="8" fill="#f9e2af"/><text x="300" y="28" text-anchor="middle" fill="#1e1e2e" font-size="18" font-weight="bold">3</text>
    <text x="350" y="28" fill="#a6e3a1" font-size="14">→ null ✅</text>

    <text x="20" y="65" fill="#89b4fa" font-size="11">■ front nodes</text>
    <text x="150" y="65" fill="#f9e2af" font-size="11">■ back nodes (from stack)</text>
  </g>
</svg>