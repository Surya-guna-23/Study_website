<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bglr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="780" height="480" rx="12" fill="url(#bglr)"/>
  <text x="390" y="28" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Longest Repeating Character Replacement</text>
  <text x="390" y="46" text-anchor="middle" fill="#6c7086" font-size="12">s = "AABABBA", k = 1</text>

  <!-- String -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="55" height="38" rx="6" fill="#a6e3a1"/><text x="27" y="25" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">A</text><text x="27" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">0</text>
    <rect x="65" y="0" width="55" height="38" rx="6" fill="#a6e3a1"/><text x="92" y="25" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">A</text><text x="92" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">1</text>
    <rect x="130" y="0" width="55" height="38" rx="6" fill="#f38ba8"/><text x="157" y="25" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">B</text><text x="157" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">2</text>
    <rect x="195" y="0" width="55" height="38" rx="6" fill="#a6e3a1"/><text x="222" y="25" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">A</text><text x="222" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">3</text>
    <rect x="260" y="0" width="55" height="38" rx="6" fill="#f38ba8"/><text x="287" y="25" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">B</text><text x="287" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">4</text>
    <rect x="325" y="0" width="55" height="38" rx="6" fill="#f38ba8"/><text x="352" y="25" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">B</text><text x="352" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">5</text>
    <rect x="390" y="0" width="55" height="38" rx="6" fill="#a6e3a1"/><text x="417" y="25" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">A</text><text x="417" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">6</text>
    <!-- Best window bracket -->
    <rect x="-4" y="42" width="254" height="6" rx="3" fill="#a6e3a1" opacity="0.7"/>
    <text x="125" y="60" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">Best window: "AABA" (length 4, replace 1 B)</text>
  </g>

  <!-- Key insight -->
  <g transform="translate(30, 130)">
    <rect x="0" y="0" width="720" height="36" rx="6" fill="#313244" stroke="#f9e2af"/>
    <text x="360" y="23" text-anchor="middle" fill="#f9e2af" font-size="12" font-weight="bold">Key: replacements needed = (window size) - maxfreq | if &gt; k → shrink from left</text>
  </g>

  <!-- Steps -->
  <g transform="translate(30, 178)">
    <rect x="0" y="0" width="720" height="26" rx="4" fill="#45475a"/>
    <text x="30" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">r</text>
    <text x="75" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">s[r]</text>
    <text x="150" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">Freq {A,B}</text>
    <text x="260" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">maxfreq</text>
    <text x="350" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">Window</text>
    <text x="440" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">Replacements</text>
    <text x="530" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">&gt; k?</text>
    <text x="610" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">l</text>
    <text x="680" y="18" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">maxlen</text>

    <rect x="0" y="30" width="720" height="22" fill="#313244"/>
    <text x="30" y="45" text-anchor="middle" fill="#cdd6f4" font-size="9">0</text>
    <text x="75" y="45" text-anchor="middle" fill="#a6e3a1" font-size="9">A</text>
    <text x="150" y="45" text-anchor="middle" fill="#cdd6f4" font-size="9">{A:1}</text>
    <text x="260" y="45" text-anchor="middle" fill="#cdd6f4" font-size="9">1</text>
    <text x="350" y="45" text-anchor="middle" fill="#cdd6f4" font-size="9">1</text>
    <text x="440" y="45" text-anchor="middle" fill="#cdd6f4" font-size="9">0</text>
    <text x="530" y="45" text-anchor="middle" fill="#a6e3a1" font-size="9">No</text>
    <text x="610" y="45" text-anchor="middle" fill="#cdd6f4" font-size="9">0</text>
    <text x="680" y="45" text-anchor="middle" fill="#cdd6f4" font-size="9">1</text>

    <rect x="0" y="54" width="720" height="22" fill="#2a2a3c"/>
    <text x="30" y="69" text-anchor="middle" fill="#cdd6f4" font-size="9">1</text>
    <text x="75" y="69" text-anchor="middle" fill="#a6e3a1" font-size="9">A</text>
    <text x="150" y="69" text-anchor="middle" fill="#cdd6f4" font-size="9">{A:2}</text>
    <text x="260" y="69" text-anchor="middle" fill="#cdd6f4" font-size="9">2</text>
    <text x="350" y="69" text-anchor="middle" fill="#cdd6f4" font-size="9">2</text>
    <text x="440" y="69" text-anchor="middle" fill="#cdd6f4" font-size="9">0</text>
    <text x="530" y="69" text-anchor="middle" fill="#a6e3a1" font-size="9">No</text>
    <text x="610" y="69" text-anchor="middle" fill="#cdd6f4" font-size="9">0</text>
    <text x="680" y="69" text-anchor="middle" fill="#cdd6f4" font-size="9">2</text>

    <rect x="0" y="78" width="720" height="22" fill="#313244"/>
    <text x="30" y="93" text-anchor="middle" fill="#cdd6f4" font-size="9">2</text>
    <text x="75" y="93" text-anchor="middle" fill="#f38ba8" font-size="9">B</text>
    <text x="150" y="93" text-anchor="middle" fill="#cdd6f4" font-size="9">{A:2, B:1}</text>
    <text x="260" y="93" text-anchor="middle" fill="#cdd6f4" font-size="9">2</text>
    <text x="350" y="93" text-anchor="middle" fill="#cdd6f4" font-size="9">3</text>
    <text x="440" y="93" text-anchor="middle" fill="#f9e2af" font-size="9">1</text>
    <text x="530" y="93" text-anchor="middle" fill="#a6e3a1" font-size="9">No (=k)</text>
    <text x="610" y="93" text-anchor="middle" fill="#cdd6f4" font-size="9">0</text>
    <text x="680" y="93" text-anchor="middle" fill="#cdd6f4" font-size="9">3</text>

    <rect x="0" y="102" width="720" height="24" fill="#1e3a2f" stroke="#a6e3a1"/>
    <text x="30" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">3</text>
    <text x="75" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">A</text>
    <text x="150" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9">{A:3, B:1}</text>
    <text x="260" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">3</text>
    <text x="350" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">4 ⭐</text>
    <text x="440" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9">1</text>
    <text x="530" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9">No</text>
    <text x="610" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9">0</text>
    <text x="680" y="118" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">4</text>

    <rect x="0" y="128" width="720" height="22" fill="#313244"/>
    <text x="30" y="143" text-anchor="middle" fill="#cdd6f4" font-size="9">4</text>
    <text x="75" y="143" text-anchor="middle" fill="#f38ba8" font-size="9">B</text>
    <text x="150" y="143" text-anchor="middle" fill="#cdd6f4" font-size="9">{A:3, B:2}</text>
    <text x="260" y="143" text-anchor="middle" fill="#cdd6f4" font-size="9">3</text>
    <text x="350" y="143" text-anchor="middle" fill="#cdd6f4" font-size="9">5</text>
    <text x="440" y="143" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">2</text>
    <text x="530" y="143" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">YES → shrink</text>
    <text x="610" y="143" text-anchor="middle" fill="#f9e2af" font-size="9">→1</text>
    <text x="680" y="143" text-anchor="middle" fill="#cdd6f4" font-size="9">4</text>

    <rect x="0" y="152" width="720" height="22" fill="#2a2a3c"/>
    <text x="30" y="167" text-anchor="middle" fill="#cdd6f4" font-size="9">5</text>
    <text x="75" y="167" text-anchor="middle" fill="#f38ba8" font-size="9">B</text>
    <text x="150" y="167" text-anchor="middle" fill="#cdd6f4" font-size="9">{A:2, B:3}</text>
    <text x="260" y="167" text-anchor="middle" fill="#cdd6f4" font-size="9">3</text>
    <text x="350" y="167" text-anchor="middle" fill="#cdd6f4" font-size="9">5</text>
    <text x="440" y="167" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">2</text>
    <text x="530" y="167" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">YES → shrink</text>
    <text x="610" y="167" text-anchor="middle" fill="#f9e2af" font-size="9">→2</text>
    <text x="680" y="167" text-anchor="middle" fill="#cdd6f4" font-size="9">4</text>

    <rect x="0" y="176" width="720" height="22" fill="#313244"/>
    <text x="30" y="191" text-anchor="middle" fill="#cdd6f4" font-size="9">6</text>
    <text x="75" y="191" text-anchor="middle" fill="#a6e3a1" font-size="9">A</text>
    <text x="150" y="191" text-anchor="middle" fill="#cdd6f4" font-size="9">{A:2, B:2}</text>
    <text x="260" y="191" text-anchor="middle" fill="#cdd6f4" font-size="9">3</text>
    <text x="350" y="191" text-anchor="middle" fill="#cdd6f4" font-size="9">5</text>
    <text x="440" y="191" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">2</text>
    <text x="530" y="191" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">YES → shrink</text>
    <text x="610" y="191" text-anchor="middle" fill="#f9e2af" font-size="9">→3</text>
    <text x="680" y="191" text-anchor="middle" fill="#cdd6f4" font-size="9">4</text>
  </g>

  <rect x="260" y="438" width="260" height="32" rx="16" fill="#a6e3a1"/>
  <text x="390" y="459" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Output: 4 ("AABA") ✅</text>
</svg>