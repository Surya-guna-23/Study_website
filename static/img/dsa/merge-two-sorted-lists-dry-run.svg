<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6e3a1"/></marker>
  </defs>
  <rect width="750" height="480" rx="12" fill="url(#bg7)"/>
  <text x="375" y="32" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Merge Two Sorted Lists — Dry Run: [1,2,4] + [1,3,4]</text>

  <!-- Two input lists -->
  <text x="30" y="62" fill="#89b4fa" font-size="12" font-weight="bold">list1:</text>
  <g transform="translate(80, 46)">
    <circle cx="0" cy="12" r="16" fill="#89b4fa"/><text x="0" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">1</text>
    <line x1="16" y1="12" x2="50" y2="12" stroke="#89b4fa" stroke-width="2"/>
    <circle cx="66" cy="12" r="16" fill="#89b4fa"/><text x="66" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">2</text>
    <line x1="82" y1="12" x2="116" y2="12" stroke="#89b4fa" stroke-width="2"/>
    <circle cx="132" cy="12" r="16" fill="#89b4fa"/><text x="132" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">4</text>
  </g>

  <text x="320" y="62" fill="#f9e2af" font-size="12" font-weight="bold">list2:</text>
  <g transform="translate(370, 46)">
    <circle cx="0" cy="12" r="16" fill="#f9e2af"/><text x="0" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">1</text>
    <line x1="16" y1="12" x2="50" y2="12" stroke="#f9e2af" stroke-width="2"/>
    <circle cx="66" cy="12" r="16" fill="#f9e2af"/><text x="66" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">3</text>
    <line x1="82" y1="12" x2="116" y2="12" stroke="#f9e2af" stroke-width="2"/>
    <circle cx="132" cy="12" r="16" fill="#f9e2af"/><text x="132" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">4</text>
  </g>

  <!-- Steps -->
  <g transform="translate(30, 88)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="690" height="48" rx="6" fill="#313244" stroke="#45475a"/>
    <circle cx="20" cy="24" r="12" fill="#f9e2af"/><text x="20" y="29" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">1</text>
    <text x="42" y="20" fill="#cdd6f4" font-size="11">list1(1) vs list2(1): 1 &lt; 1? <tspan fill="#f38ba8">No</tspan> → attach <tspan fill="#f9e2af" font-weight="bold">list2(1)</tspan></text>
    <text x="42" y="38" fill="#a6adc8" font-size="11">Merged: <tspan fill="#a6e3a1">1</tspan></text>

    <!-- Step 2 -->
    <rect x="0" y="54" width="690" height="48" rx="6" fill="#2a2a3c" stroke="#45475a"/>
    <circle cx="20" cy="78" r="12" fill="#89b4fa"/><text x="20" y="83" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">2</text>
    <text x="42" y="74" fill="#cdd6f4" font-size="11">list1(1) vs list2(3): 1 &lt; 3? <tspan fill="#a6e3a1">Yes</tspan> → attach <tspan fill="#89b4fa" font-weight="bold">list1(1)</tspan></text>
    <text x="42" y="92" fill="#a6adc8" font-size="11">Merged: <tspan fill="#a6e3a1">1→1</tspan></text>

    <!-- Step 3 -->
    <rect x="0" y="108" width="690" height="48" rx="6" fill="#313244" stroke="#45475a"/>
    <circle cx="20" cy="132" r="12" fill="#89b4fa"/><text x="20" y="137" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">3</text>
    <text x="42" y="128" fill="#cdd6f4" font-size="11">list1(2) vs list2(3): 2 &lt; 3? <tspan fill="#a6e3a1">Yes</tspan> → attach <tspan fill="#89b4fa" font-weight="bold">list1(2)</tspan></text>
    <text x="42" y="146" fill="#a6adc8" font-size="11">Merged: <tspan fill="#a6e3a1">1→1→2</tspan></text>

    <!-- Step 4 -->
    <rect x="0" y="162" width="690" height="48" rx="6" fill="#2a2a3c" stroke="#45475a"/>
    <circle cx="20" cy="186" r="12" fill="#f9e2af"/><text x="20" y="191" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">4</text>
    <text x="42" y="182" fill="#cdd6f4" font-size="11">list1(4) vs list2(3): 4 &lt; 3? <tspan fill="#f38ba8">No</tspan> → attach <tspan fill="#f9e2af" font-weight="bold">list2(3)</tspan></text>
    <text x="42" y="200" fill="#a6adc8" font-size="11">Merged: <tspan fill="#a6e3a1">1→1→2→3</tspan></text>

    <!-- Step 5 -->
    <rect x="0" y="216" width="690" height="48" rx="6" fill="#313244" stroke="#45475a"/>
    <circle cx="20" cy="240" r="12" fill="#f9e2af"/><text x="20" y="245" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">5</text>
    <text x="42" y="236" fill="#cdd6f4" font-size="11">list1(4) vs list2(4): 4 &lt; 4? <tspan fill="#f38ba8">No</tspan> → attach <tspan fill="#f9e2af" font-weight="bold">list2(4)</tspan></text>
    <text x="42" y="254" fill="#a6adc8" font-size="11">Merged: <tspan fill="#a6e3a1">1→1→2→3→4</tspan></text>

    <!-- Step 6 -->
    <rect x="0" y="270" width="690" height="48" rx="6" fill="#1e3a2f" stroke="#a6e3a1"/>
    <circle cx="20" cy="294" r="12" fill="#a6e3a1"/><text x="20" y="299" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">6</text>
    <text x="42" y="290" fill="#a6e3a1" font-size="11" font-weight="bold">list2 exhausted → append remaining list1(4)</text>
    <text x="42" y="308" fill="#a6e3a1" font-size="11">Merged: <tspan font-weight="bold">1→1→2→3→4→4</tspan></text>
  </g>

  <!-- Final result -->
  <text x="30" y="425" fill="#a6e3a1" font-size="13" font-weight="bold">Result:</text>
  <g transform="translate(100, 408)">
    <circle cx="0" cy="12" r="16" fill="#a6e3a1"/><text x="0" y="17" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">1</text>
    <line x1="16" y1="12" x2="44" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr7)"/>
    <circle cx="60" cy="12" r="16" fill="#a6e3a1"/><text x="60" y="17" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">1</text>
    <line x1="76" y1="12" x2="104" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr7)"/>
    <circle cx="120" cy="12" r="16" fill="#a6e3a1"/><text x="120" y="17" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">2</text>
    <line x1="136" y1="12" x2="164" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr7)"/>
    <circle cx="180" cy="12" r="16" fill="#a6e3a1"/><text x="180" y="17" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">3</text>
    <line x1="196" y1="12" x2="224" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr7)"/>
    <circle cx="240" cy="12" r="16" fill="#a6e3a1"/><text x="240" y="17" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">4</text>
    <line x1="256" y1="12" x2="284" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr7)"/>
    <circle cx="300" cy="12" r="16" fill="#a6e3a1"/><text x="300" y="17" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">4</text>
    <text x="330" y="17" fill="#a6e3a1" font-size="12"> ✅</text>
  </g>
</svg>