<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgmk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="750" height="480" rx="12" fill="url(#bgmk)"/>
  <text x="375" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Merge K Sorted Lists — Min-Heap Dry Run</text>
  <text x="375" y="48" text-anchor="middle" fill="#6c7086" font-size="12">lists = [[1,4,5], [1,3,4], [2,6]]</text>

  <!-- Input lists -->
  <g transform="translate(30, 62)">
    <text x="0" y="14" fill="#89b4fa" font-size="11" font-weight="bold">List 0:</text>
    <rect x="55" y="0" width="30" height="22" rx="4" fill="#89b4fa"/><text x="70" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">1</text>
    <rect x="90" y="0" width="30" height="22" rx="4" fill="#89b4fa"/><text x="105" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10">4</text>
    <rect x="125" y="0" width="30" height="22" rx="4" fill="#89b4fa"/><text x="140" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10">5</text>

    <text x="200" y="14" fill="#f9e2af" font-size="11" font-weight="bold">List 1:</text>
    <rect x="255" y="0" width="30" height="22" rx="4" fill="#f9e2af"/><text x="270" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">1</text>
    <rect x="290" y="0" width="30" height="22" rx="4" fill="#f9e2af"/><text x="305" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10">3</text>
    <rect x="325" y="0" width="30" height="22" rx="4" fill="#f9e2af"/><text x="340" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10">4</text>

    <text x="400" y="14" fill="#cba6f7" font-size="11" font-weight="bold">List 2:</text>
    <rect x="455" y="0" width="30" height="22" rx="4" fill="#cba6f7"/><text x="470" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">2</text>
    <rect x="490" y="0" width="30" height="22" rx="4" fill="#cba6f7"/><text x="505" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10">6</text>
  </g>

  <!-- Steps table -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="690" height="28" rx="4" fill="#45475a"/>
    <text x="40" y="19" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">Step</text>
    <text x="140" y="19" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">Dequeue (min)</text>
    <text x="340" y="19" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">Heap State</text>
    <text x="570" y="19" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">Result</text>

    <rect x="0" y="32" width="690" height="26" fill="#313244"/>
    <text x="40" y="50" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <text x="140" y="50" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">1 (L0)</text>
    <text x="340" y="50" text-anchor="middle" fill="#a6adc8" font-size="10">[1, 2, 4] (push 4)</text>
    <text x="570" y="50" text-anchor="middle" fill="#a6e3a1" font-size="10">1</text>

    <rect x="0" y="60" width="690" height="26" fill="#2a2a3c"/>
    <text x="40" y="78" text-anchor="middle" fill="#cdd6f4" font-size="10">2</text>
    <text x="140" y="78" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">1 (L1)</text>
    <text x="340" y="78" text-anchor="middle" fill="#a6adc8" font-size="10">[2, 4, 3] (push 3)</text>
    <text x="570" y="78" text-anchor="middle" fill="#a6e3a1" font-size="10">1→1</text>

    <rect x="0" y="88" width="690" height="26" fill="#313244"/>
    <text x="40" y="106" text-anchor="middle" fill="#cdd6f4" font-size="10">3</text>
    <text x="140" y="106" text-anchor="middle" fill="#cba6f7" font-size="10" font-weight="bold">2 (L2)</text>
    <text x="340" y="106" text-anchor="middle" fill="#a6adc8" font-size="10">[3, 4, 6] (push 6)</text>
    <text x="570" y="106" text-anchor="middle" fill="#a6e3a1" font-size="10">1→1→2</text>

    <rect x="0" y="116" width="690" height="26" fill="#2a2a3c"/>
    <text x="40" y="134" text-anchor="middle" fill="#cdd6f4" font-size="10">4</text>
    <text x="140" y="134" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">3 (L1)</text>
    <text x="340" y="134" text-anchor="middle" fill="#a6adc8" font-size="10">[4, 6, 4] (push 4)</text>
    <text x="570" y="134" text-anchor="middle" fill="#a6e3a1" font-size="10">1→1→2→3</text>

    <rect x="0" y="144" width="690" height="26" fill="#313244"/>
    <text x="40" y="162" text-anchor="middle" fill="#cdd6f4" font-size="10">5</text>
    <text x="140" y="162" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">4 (L0)</text>
    <text x="340" y="162" text-anchor="middle" fill="#a6adc8" font-size="10">[4, 6, 5] (push 5)</text>
    <text x="570" y="162" text-anchor="middle" fill="#a6e3a1" font-size="10">1→1→2→3→4</text>

    <rect x="0" y="172" width="690" height="26" fill="#2a2a3c"/>
    <text x="40" y="190" text-anchor="middle" fill="#cdd6f4" font-size="10">6</text>
    <text x="140" y="190" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">4 (L1)</text>
    <text x="340" y="190" text-anchor="middle" fill="#a6adc8" font-size="10">[5, 6] (no next)</text>
    <text x="570" y="190" text-anchor="middle" fill="#a6e3a1" font-size="10">1→1→2→3→4→4</text>

    <rect x="0" y="200" width="690" height="26" fill="#313244"/>
    <text x="40" y="218" text-anchor="middle" fill="#cdd6f4" font-size="10">7</text>
    <text x="140" y="218" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">5 (L0)</text>
    <text x="340" y="218" text-anchor="middle" fill="#a6adc8" font-size="10">[6] (no next)</text>
    <text x="570" y="218" text-anchor="middle" fill="#a6e3a1" font-size="10">1→1→2→3→4→4→5</text>

    <rect x="0" y="228" width="690" height="28" fill="#1e3a2f" stroke="#a6e3a1"/>
    <text x="40" y="247" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">8</text>
    <text x="140" y="247" text-anchor="middle" fill="#cba6f7" font-size="10" font-weight="bold">6 (L2)</text>
    <text x="340" y="247" text-anchor="middle" fill="#a6e3a1" font-size="10">[] (empty)</text>
    <text x="570" y="247" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">1→1→2→3→4→4→5→6</text>
  </g>

  <!-- Heap visualization -->
  <g transform="translate(30, 375)">
    <rect x="0" y="0" width="690" height="40" rx="6" fill="#313244" stroke="#45475a"/>
    <text x="15" y="25" fill="#f9e2af" font-size="12" font-weight="bold">Min-Heap always gives smallest element → O(N log k) total</text>
  </g>

  <rect x="195" y="432" width="360" height="34" rx="17" fill="#a6e3a1"/>
  <text x="375" y="454" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Output: [1, 1, 2, 3, 4, 4, 5, 6] ✅</text>
</svg>