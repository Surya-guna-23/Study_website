<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="780" height="580" rx="12" fill="url(#bg2)"/>
  <text x="390" y="35" text-anchor="middle" fill="#cdd6f4" font-size="17" font-weight="bold">Valid Anagram — Dry Run: s="anagram", t="nagaram"</text>
  
  <!-- Strings -->
  <text x="30" y="68" fill="#89b4fa" font-size="13" font-weight="bold">s = "anagram"</text>
  <g transform="translate(30, 78)">
    <rect x="0" y="0" width="36" height="32" rx="5" fill="#89b4fa"/><text x="18" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">a</text>
    <rect x="42" y="0" width="36" height="32" rx="5" fill="#89b4fa"/><text x="60" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">n</text>
    <rect x="84" y="0" width="36" height="32" rx="5" fill="#89b4fa"/><text x="102" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">a</text>
    <rect x="126" y="0" width="36" height="32" rx="5" fill="#89b4fa"/><text x="144" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">g</text>
    <rect x="168" y="0" width="36" height="32" rx="5" fill="#89b4fa"/><text x="186" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">r</text>
    <rect x="210" y="0" width="36" height="32" rx="5" fill="#89b4fa"/><text x="228" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">a</text>
    <rect x="252" y="0" width="36" height="32" rx="5" fill="#89b4fa"/><text x="270" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">m</text>
  </g>

  <text x="420" y="68" fill="#f9e2af" font-size="13" font-weight="bold">t = "nagaram"</text>
  <g transform="translate(420, 78)">
    <rect x="0" y="0" width="36" height="32" rx="5" fill="#f9e2af"/><text x="18" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">n</text>
    <rect x="42" y="0" width="36" height="32" rx="5" fill="#f9e2af"/><text x="60" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">a</text>
    <rect x="84" y="0" width="36" height="32" rx="5" fill="#f9e2af"/><text x="102" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">g</text>
    <rect x="126" y="0" width="36" height="32" rx="5" fill="#f9e2af"/><text x="144" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">a</text>
    <rect x="168" y="0" width="36" height="32" rx="5" fill="#f9e2af"/><text x="186" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">r</text>
    <rect x="210" y="0" width="36" height="32" rx="5" fill="#f9e2af"/><text x="228" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">a</text>
    <rect x="252" y="0" width="36" height="32" rx="5" fill="#f9e2af"/><text x="270" y="22" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">m</text>
  </g>

  <!-- Length Check -->
