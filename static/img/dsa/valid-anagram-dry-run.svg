    <text x="60" y="20" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">Key</text>
    <text x="200" y="20" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">smap[key]</text>
    <text x="380" y="20" text-anchor="middle" fill="#f9e2af" font-size="12" font-weight="bold">tmap[key]</text>
    <text x="550" y="20" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">Match?</text>
    <!-- Row 1: n -->
    <rect x="0" y="36" width="720" height="30" rx="0" fill="#313244"/>
    <text x="60" y="56" text-anchor="middle" fill="#cdd6f4" font-size="13">n</text>
    <text x="200" y="56" text-anchor="middle" fill="#89b4fa" font-size="13">1</text>
    <text x="380" y="56" text-anchor="middle" fill="#f9e2af" font-size="13">1</text>
    <text x="550" y="56" text-anchor="middle" fill="#a6e3a1" font-size="13">✅</text>
    <!-- Row 2: a -->
    <rect x="0" y="68" width="720" height="30" rx="0" fill="#2a2a3c"/>
    <text x="60" y="88" text-anchor="middle" fill="#cdd6f4" font-size="13">a</text>
    <text x="200" y="88" text-anchor="middle" fill="#89b4fa" font-size="13">3</text>
    <text x="380" y="88" text-anchor="middle" fill="#f9e2af" font-size="13">3</text>
    <text x="550" y="88" text-anchor="middle" fill="#a6e3a1" font-size="13">✅</text>
    <!-- Row 3: g -->
    <rect x="0" y="100" width="720" height="30" rx="0" fill="#313244"/>
    <text x="60" y="120" text-anchor="middle" fill="#cdd6f4" font-size="13">g</text>
    <text x="200" y="120" text-anchor="middle" fill="#89b4fa" font-size="13">1</text>
    <text x="380" y="120" text-anchor="middle" fill="#f9e2af" font-size="13">1</text>
    <text x="550" y="120" text-anchor="middle" fill="#a6e3a1" font-size="13">✅</text>
    <!-- Row 4: r -->
    <rect x="0" y="132" width="720" height="30" rx="0" fill="#2a2a3c"/>
    <text x="60" y="152" text-anchor="middle" fill="#cdd6f4" font-size="13">r</text>
    <text x="200" y="152" text-anchor="middle" fill="#89b4fa" font-size="13">1</text>
    <text x="380" y="152" text-anchor="middle" fill="#f9e2af" font-size="13">1</text>
    <text x="550" y="152" text-anchor="middle" fill="#a6e3a1" font-size="13">✅</text>
    <!-- Row 5: m -->
    <rect x="0" y="164" width="720" height="30" rx="0" fill="#313244"/>
    <text x="60" y="184" text-anchor="middle" fill="#cdd6f4" font-size="13">m</text>
    <text x="200" y="184" text-anchor="middle" fill="#89b4fa" font-size="13">1</text>
    <text x="380" y="184" text-anchor="middle" fill="#f9e2af" font-size="13">1</text>
    <text x="550" y="184" text-anchor="middle" fill="#a6e3a1" font-size="13">✅</text>
  </g>

  <!-- Result -->
  <rect x="240" y="525" width="300" height="38" rx="19" fill="#a6e3a1"/>
  <text x="390" y="550" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">All frequencies match → true ✅</text>
</svg>