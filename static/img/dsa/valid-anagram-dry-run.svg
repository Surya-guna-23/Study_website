    <rect x="0" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="30" y="20" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">a</text>
    <text x="30" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">3</text>
    <!-- n:1 -->
    <rect x="70" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">n</text>
    <text x="100" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">1</text>
    <!-- g:1 -->
    <rect x="140" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="170" y="20" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">g</text>
    <text x="170" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">1</text>
    <!-- r:1 -->
    <rect x="210" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="240" y="20" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">r</text>
    <text x="240" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">1</text>
    <!-- m:1 -->
    <rect x="280" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="310" y="20" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">m</text>
    <text x="310" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">1</text>
  </g>

  <text x="420" y="192" fill="#f9e2af" font-size="14" font-weight="bold">tmap (Frequency Map for t):</text>
  <g transform="translate(420, 202)">
    <rect x="0" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="30" y="20" text-anchor="middle" fill="#f9e2af" font-size="14" font-weight="bold">n</text>
    <text x="30" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">1</text>
    <rect x="70" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#f9e2af" font-size="14" font-weight="bold">a</text>
    <text x="100" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">3</text>
    <rect x="140" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="170" y="20" text-anchor="middle" fill="#f9e2af" font-size="14" font-weight="bold">g</text>
    <text x="170" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">1</text>
    <rect x="210" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="240" y="20" text-anchor="middle" fill="#f9e2af" font-size="14" font-weight="bold">r</text>
    <text x="240" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">1</text>
    <rect x="280" y="0" width="60" height="55" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="310" y="20" text-anchor="middle" fill="#f9e2af" font-size="14" font-weight="bold">m</text>
    <text x="310" y="44" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">1</text>
  </g>

  <!-- Comparison -->
  <text x="30" y="295" fill="#a6e3a1" font-size="14" font-weight="bold">Compare Maps:</text>
