<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="750" height="520" rx="12" fill="url(#bgcp)"/>
  <text x="375" y="28" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Copy List with Random Pointer — 3-Pass Technique</text>
  <text x="375" y="46" text-anchor="middle" fill="#6c7086" font-size="12">[7,null] → [13,0] → [11,4] → [10,2] → [1,0]</text>

  <!-- Pass 1 -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="690" height="120" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="15" y="22" fill="#89b4fa" font-size="13" font-weight="bold">Pass 1: Interleave — insert copy after each original</text>
    <!-- Before -->
    <text x="15" y="45" fill="#6c7086" font-size="11">Before:</text>
    <g transform="translate(75, 32)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="18" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">7</text>
      <text x="40" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="52" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="70" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">13</text>
      <text x="92" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="104" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="122" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">11</text>
      <text x="144" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="156" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="174" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">10</text>
      <text x="196" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="208" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="226" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">1</text>
    </g>
    <!-- After -->
    <text x="15" y="82" fill="#a6e3a1" font-size="11">After:</text>
    <g transform="translate(60, 68)">
      <rect x="0" y="0" width="30" height="22" rx="4" fill="#89b4fa"/><text x="15" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">7</text>
      <text x="33" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="40" y="0" width="30" height="22" rx="4" fill="#a6e3a1"/><text x="55" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">7'</text>
      <text x="73" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="80" y="0" width="34" height="22" rx="4" fill="#89b4fa"/><text x="97" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">13</text>
      <text x="117" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="124" y="0" width="34" height="22" rx="4" fill="#a6e3a1"/><text x="141" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">13'</text>
      <text x="161" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="168" y="0" width="34" height="22" rx="4" fill="#89b4fa"/><text x="185" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">11</text>
      <text x="205" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="212" y="0" width="34" height="22" rx="4" fill="#a6e3a1"/><text x="229" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">11'</text>
      <text x="249" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="256" y="0" width="34" height="22" rx="4" fill="#89b4fa"/><text x="273" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">10</text>
      <text x="293" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="300" y="0" width="34" height="22" rx="4" fill="#a6e3a1"/><text x="317" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">10'</text>
      <text x="337" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="344" y="0" width="30" height="22" rx="4" fill="#89b4fa"/><text x="359" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">1</text>
      <text x="377" y="16" fill="#585b70" font-size="8">→</text>
      <rect x="384" y="0" width="30" height="22" rx="4" fill="#a6e3a1"/><text x="399" y="16" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">1'</text>
    </g>
    <text x="15" y="110" fill="#6c7086" font-size="10">■ original nodes  <tspan fill="#a6e3a1">■ copy nodes</tspan></text>
  </g>

  <!-- Pass 2 -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="690" height="130" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="15" y="22" fill="#f9e2af" font-size="13" font-weight="bold">Pass 2: Set random pointers on copies</text>
    <text x="15" y="42" fill="#a6adc8" font-size="11">copy.random = original.random ? original.random.next : null</text>

    <!-- Table -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="660" height="24" rx="3" fill="#45475a"/>
      <text x="60" y="17" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">Original</text>
      <text x="200" y="17" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">orig.random</text>
      <text x="400" y="17" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">copy.random = orig.random.next</text>

      <rect x="0" y="26" width="660" height="20" fill="#2a2a3c"/>
      <text x="60" y="40" text-anchor="middle" fill="#89b4fa" font-size="10">7</text>
      <text x="200" y="40" text-anchor="middle" fill="#6c7086" font-size="10">null</text>
      <text x="400" y="40" text-anchor="middle" fill="#a6e3a1" font-size="10">null</text>

      <rect x="0" y="48" width="660" height="20" fill="#313244"/>
      <text x="60" y="62" text-anchor="middle" fill="#89b4fa" font-size="10">13</text>
      <text x="200" y="62" text-anchor="middle" fill="#89b4fa" font-size="10">7</text>
      <text x="400" y="62" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">7'</text>
    </g>
  </g>

  <!-- Pass 3 -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="690" height="110" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="15" y="22" fill="#a6e3a1" font-size="13" font-weight="bold">Pass 3: Separate into two lists</text>
    <!-- Original -->
    <text x="15" y="48" fill="#89b4fa" font-size="11" font-weight="bold">Original:</text>
    <g transform="translate(90, 34)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="18" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">7</text>
      <text x="40" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="52" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="70" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">13</text>
      <text x="92" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="104" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="122" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">11</text>
      <text x="144" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="156" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="174" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">10</text>
      <text x="196" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="208" y="0" width="36" height="22" rx="4" fill="#89b4fa"/><text x="226" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">1</text>
    </g>
    <!-- Copy -->
    <text x="15" y="82" fill="#a6e3a1" font-size="11" font-weight="bold">Deep Copy:</text>
    <g transform="translate(90, 68)">
      <rect x="0" y="0" width="36" height="22" rx="4" fill="#a6e3a1"/><text x="18" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">7'</text>
      <text x="40" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="52" y="0" width="36" height="22" rx="4" fill="#a6e3a1"/><text x="70" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">13'</text>
      <text x="92" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="104" y="0" width="36" height="22" rx="4" fill="#a6e3a1"/><text x="122" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">11'</text>
      <text x="144" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="156" y="0" width="36" height="22" rx="4" fill="#a6e3a1"/><text x="174" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">10'</text>
      <text x="196" y="16" fill="#585b70" font-size="10">→</text>
      <rect x="208" y="0" width="36" height="22" rx="4" fill="#a6e3a1"/><text x="226" y="16" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">1'</text>
      <text x="260" y="16" fill="#a6e3a1" font-size="11"> ✅ with random ptrs</text>
    </g>
  </g>

  <rect x="230" y="468" width="290" height="32" rx="16" fill="#a6e3a1"/>
  <text x="375" y="489" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">Deep copy created successfully ✅</text>
</svg>