<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgfd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="12" fill="url(#bgfd)"/>
  <text x="360" y="32" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Find the Duplicate Number — Dry Run: [1, 3, 4, 2, 2]</text>

  <!-- Array -->
  <text x="30" y="62" fill="#89b4fa" font-size="12" font-weight="bold">Input:</text>
  <g transform="translate(85, 44)">
    <rect x="0" y="0" width="45" height="34" rx="6" fill="#89b4fa"/><text x="22" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">1</text><text x="22" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">i=0</text>
    <rect x="52" y="0" width="45" height="34" rx="6" fill="#89b4fa"/><text x="74" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">3</text><text x="74" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">i=1</text>
    <rect x="104" y="0" width="45" height="34" rx="6" fill="#89b4fa"/><text x="126" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">4</text><text x="126" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">i=2</text>
    <rect x="156" y="0" width="45" height="34" rx="6" fill="#89b4fa"/><text x="178" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">2</text><text x="178" y="-5" text-anchor="middle" fill="#6c7086" font-size="9">i=3</text>
    <rect x="208" y="0" width="45" height="34" rx="6" fill="#f38ba8"/><text x="230" y="23" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">2</text><text x="230" y="-5" text-anchor="middle" fill="#f38ba8" font-size="9">i=4 dup!</text>
  </g>

  <!-- Steps -->
  <g transform="translate(30, 98)">
    <rect x="0" y="0" width="660" height="48" rx="6" fill="#313244" stroke="#45475a"/>
    <circle cx="20" cy="24" r="12" fill="#89b4fa"/><text x="20" y="29" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">1</text>
    <text x="42" y="20" fill="#cdd6f4" font-size="12">nums[0]=1 → Set.has(1)? No → Add</text>
    <text x="400" y="20" fill="#6c7086" font-size="11">Set: </text><text x="435" y="20" fill="#89b4fa" font-size="12">{ 1 }</text>

    <rect x="0" y="54" width="660" height="48" rx="6" fill="#2a2a3c" stroke="#45475a"/>
    <circle cx="20" cy="78" r="12" fill="#89b4fa"/><text x="20" y="83" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">2</text>
    <text x="42" y="74" fill="#cdd6f4" font-size="12">nums[1]=3 → Set.has(3)? No → Add</text>
    <text x="400" y="74" fill="#6c7086" font-size="11">Set: </text><text x="435" y="74" fill="#89b4fa" font-size="12">{ 1, 3 }</text>

    <rect x="0" y="108" width="660" height="48" rx="6" fill="#313244" stroke="#45475a"/>
    <circle cx="20" cy="132" r="12" fill="#89b4fa"/><text x="20" y="137" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">3</text>
    <text x="42" y="128" fill="#cdd6f4" font-size="12">nums[2]=4 → Set.has(4)? No → Add</text>
    <text x="400" y="128" fill="#6c7086" font-size="11">Set: </text><text x="435" y="128" fill="#89b4fa" font-size="12">{ 1, 3, 4 }</text>

    <rect x="0" y="162" width="660" height="48" rx="6" fill="#2a2a3c" stroke="#45475a"/>
    <circle cx="20" cy="186" r="12" fill="#89b4fa"/><text x="20" y="191" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">4</text>
    <text x="42" y="182" fill="#cdd6f4" font-size="12">nums[3]=2 → Set.has(2)? No → Add</text>
    <text x="400" y="182" fill="#6c7086" font-size="11">Set: </text><text x="435" y="182" fill="#89b4fa" font-size="12">{ 1, 3, 4, 2 }</text>

    <rect x="0" y="216" width="660" height="52" rx="6" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <circle cx="20" cy="242" r="12" fill="#a6e3a1"/><text x="20" y="247" text-anchor="middle" fill="#1e1e2e" font-size="10" font-weight="bold">5</text>
    <text x="42" y="234" fill="#a6e3a1" font-size="12" font-weight="bold">nums[4]=2 → Set.has(2)? YES → Return 2</text>
    <text x="42" y="254" fill="#a6e3a1" font-size="11">Duplicate found! ✅</text>
  </g>

  <rect x="240" y="378" width="240" height="32" rx="16" fill="#a6e3a1"/>
  <text x="360" y="400" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Output: 2 ✅</text>
</svg>