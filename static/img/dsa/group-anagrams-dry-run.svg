<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="780" height="560" rx="12" fill="url(#bg4)"/>
  <text x="390" y="32" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Group Anagrams — Dry Run: ["eat","tea","tan","ate","nat","bat"]</text>

  <!-- Step rows -->
  <!-- Step 1 -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#313244" stroke="#45475a"/>
    <circle cx="22" cy="30" r="14" fill="#89b4fa"/><text x="22" y="35" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">1</text>
    <text x="48" y="20" fill="#cdd6f4" font-size="13">"eat" → sort → <tspan fill="#f9e2af" font-weight="bold">"aet"</tspan></text>
    <text x="48" y="44" fill="#a6adc8" font-size="12">New key → hash.set("aet", ["eat"])</text>
    <rect x="420" y="10" width="280" height="38" rx="6" fill="#45475a"/>
    <text x="440" y="34" fill="#f9e2af" font-size="12" font-weight="bold">aet:</text>
    <rect x="475" y="16" width="50" height="24" rx="4" fill="#89b4fa"/><text x="500" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">eat</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(30, 120)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#313244" stroke="#45475a"/>
    <circle cx="22" cy="30" r="14" fill="#89b4fa"/><text x="22" y="35" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">2</text>
    <text x="48" y="20" fill="#cdd6f4" font-size="13">"tea" → sort → <tspan fill="#f9e2af" font-weight="bold">"aet"</tspan></text>
    <text x="48" y="44" fill="#a6e3a1" font-size="12">Key exists → push to ["eat", "tea"]</text>
    <rect x="420" y="10" width="280" height="38" rx="6" fill="#45475a"/>
    <text x="440" y="34" fill="#f9e2af" font-size="12" font-weight="bold">aet:</text>
    <rect x="475" y="16" width="50" height="24" rx="4" fill="#89b4fa"/><text x="500" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">eat</text>
    <rect x="530" y="16" width="50" height="24" rx="4" fill="#a6e3a1"/><text x="555" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">tea</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(30, 190)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#313244" stroke="#45475a"/>
    <circle cx="22" cy="30" r="14" fill="#cba6f7"/><text x="22" y="35" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">3</text>
    <text x="48" y="20" fill="#cdd6f4" font-size="13">"tan" → sort → <tspan fill="#cba6f7" font-weight="bold">"ant"</tspan></text>
    <text x="48" y="44" fill="#a6adc8" font-size="12">New key → hash.set("ant", ["tan"])</text>
    <rect x="420" y="10" width="280" height="38" rx="6" fill="#45475a"/>
    <text x="440" y="34" fill="#cba6f7" font-size="12" font-weight="bold">ant:</text>
    <rect x="475" y="16" width="50" height="24" rx="4" fill="#cba6f7"/><text x="500" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">tan</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#313244" stroke="#45475a"/>
    <circle cx="22" cy="30" r="14" fill="#89b4fa"/><text x="22" y="35" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">4</text>
    <text x="48" y="20" fill="#cdd6f4" font-size="13">"ate" → sort → <tspan fill="#f9e2af" font-weight="bold">"aet"</tspan></text>
    <text x="48" y="44" fill="#a6e3a1" font-size="12">Key exists → push to ["eat", "tea", "ate"]</text>
    <rect x="420" y="10" width="280" height="38" rx="6" fill="#45475a"/>
    <text x="440" y="34" fill="#f9e2af" font-size="12" font-weight="bold">aet:</text>
    <rect x="475" y="16" width="50" height="24" rx="4" fill="#89b4fa"/><text x="500" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">eat</text>
    <rect x="530" y="16" width="50" height="24" rx="4" fill="#89b4fa"/><text x="555" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">tea</text>
    <rect x="585" y="16" width="50" height="24" rx="4" fill="#a6e3a1"/><text x="610" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">ate</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#313244" stroke="#45475a"/>
    <circle cx="22" cy="30" r="14" fill="#cba6f7"/><text x="22" y="35" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">5</text>
    <text x="48" y="20" fill="#cdd6f4" font-size="13">"nat" → sort → <tspan fill="#cba6f7" font-weight="bold">"ant"</tspan></text>
    <text x="48" y="44" fill="#a6e3a1" font-size="12">Key exists → push to ["tan", "nat"]</text>
    <rect x="420" y="10" width="280" height="38" rx="6" fill="#45475a"/>
    <text x="440" y="34" fill="#cba6f7" font-size="12" font-weight="bold">ant:</text>
    <rect x="475" y="16" width="50" height="24" rx="4" fill="#cba6f7"/><text x="500" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">tan</text>
    <rect x="530" y="16" width="50" height="24" rx="4" fill="#a6e3a1"/><text x="555" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">nat</text>
  </g>

  <!-- Step 6 -->
  <g transform="translate(30, 400)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#313244" stroke="#45475a"/>
    <circle cx="22" cy="30" r="14" fill="#f38ba8"/><text x="22" y="35" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">6</text>
    <text x="48" y="20" fill="#cdd6f4" font-size="13">"bat" → sort → <tspan fill="#f38ba8" font-weight="bold">"abt"</tspan></text>
    <text x="48" y="44" fill="#a6adc8" font-size="12">New key → hash.set("abt", ["bat"])</text>
    <rect x="420" y="10" width="280" height="38" rx="6" fill="#45475a"/>
    <text x="440" y="34" fill="#f38ba8" font-size="12" font-weight="bold">abt:</text>
    <rect x="475" y="16" width="50" height="24" rx="4" fill="#f38ba8"/><text x="500" y="34" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">bat</text>
  </g>

  <!-- Final Result -->
  <g transform="translate(30, 480)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <text x="360" y="22" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">Result: Array.from(hash.values())</text>
    <text x="360" y="46" text-anchor="middle" fill="#cdd6f4" font-size="13">[<tspan fill="#89b4fa">["eat","tea","ate"]</tspan>, <tspan fill="#cba6f7">["tan","nat"]</tspan>, <tspan fill="#f38ba8">["bat"]</tspan>] ✅</text>
  </g>
</svg>