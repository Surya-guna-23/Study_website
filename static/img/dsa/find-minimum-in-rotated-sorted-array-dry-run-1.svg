<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgfm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="380" rx="12" fill="url(#bgfm1)"/>
  <text x="360" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Find Min in Rotated Sorted Array — Step 1 of 2</text>
  <text x="360" y="50" text-anchor="middle" fill="#6c7086" font-size="12">nums = [3, 4, 5, 1, 2]</text>

  <!-- Array visualization with rotation arrow -->
  <g transform="translate(85, 75)">
    <rect x="0" y="0" width="90" height="48" rx="6" fill="#89b4fa"/>
    <text x="45" y="30" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">3</text>
    <text x="45" y="-10" text-anchor="middle" fill="#6c7086" font-size="10">0</text>

    <rect x="100" y="0" width="90" height="48" rx="6" fill="#89b4fa"/>
    <text x="145" y="30" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">4</text>
    <text x="145" y="-10" text-anchor="middle" fill="#6c7086" font-size="10">1</text>

    <rect x="200" y="0" width="90" height="48" rx="6" fill="#f9e2af"/>
    <text x="245" y="30" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">5</text>
    <text x="245" y="-10" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">mid=2</text>

    <rect x="300" y="0" width="90" height="48" rx="6" fill="#313244" stroke="#585b70"/>
    <text x="345" y="30" text-anchor="middle" fill="#a6adc8" font-size="16">1</text>
    <text x="345" y="-10" text-anchor="middle" fill="#6c7086" font-size="10">3</text>

    <rect x="400" y="0" width="90" height="48" rx="6" fill="#313244" stroke="#585b70"/>
    <text x="445" y="30" text-anchor="middle" fill="#a6adc8" font-size="16">2</text>
    <text x="445" y="-10" text-anchor="middle" fill="#6c7086" font-size="10">4</text>

    <!-- Pointers -->
    <text x="45" y="66" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">low</text>
    <text x="445" y="66" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">high</text>

    <!-- Sorted bracket -->
    <line x1="0" y1="-22" x2="290" y2="-22" stroke="#89b4fa" stroke-width="2"/>
    <text x="145" y="-26" text-anchor="middle" fill="#89b4fa" font-size="9">sorted half</text>
  </g>

  <!-- Step details -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="660" height="140" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="25" fill="#89b4fa" font-size="14" font-weight="bold">Iteration 1</text>
    <text x="15" y="48" fill="#a6adc8" font-size="12">mid = Math.ceil((0 + 4) / 2) = 2</text>
    <text x="15" y="68" fill="#a6adc8" font-size="12">nums[low] (3) &gt; nums[high] (2) → <tspan fill="#f9e2af">NOT fully sorted</tspan>, skip early break</text>
    <text x="15" y="90" fill="#a6adc8" font-size="12">nums[low] (3) ≤ nums[mid] (5) → <tspan fill="#89b4fa">Left half [3,4,5] is sorted</tspan></text>
    <text x="15" y="112" fill="#f9e2af" font-size="12">ans = Math.min(∞, nums[low]) = Math.min(∞, 3) = <tspan fill="#a6e3a1" font-weight="bold">3</tspan></text>
    <text x="15" y="132" fill="#f9e2af" font-size="12" font-weight="bold">Minimum can't be in sorted left → low = mid + 1 = 3</text>
  </g>

  <!-- Progress -->
  <rect x="230" y="340" width="260" height="28" rx="14" fill="#313244" stroke="#45475a"/>
  <rect x="230" y="340" width="130" height="28" rx="14" fill="#89b4fa"/>
  <text x="360" y="358" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">Step 1 / 2</text>
</svg>
