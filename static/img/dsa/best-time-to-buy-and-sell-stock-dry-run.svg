<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgbs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="750" height="480" rx="12" fill="url(#bgbs)"/>
  <text x="375" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Best Time to Buy and Sell Stock — Dry Run</text>
  <text x="375" y="48" text-anchor="middle" fill="#6c7086" font-size="12">prices = [7, 1, 5, 3, 6, 4]</text>

  <!-- Price chart visualization -->
  <g transform="translate(50, 60)">
    <text x="0" y="12" fill="#6c7086" font-size="10">Price</text>
    <!-- Y axis -->
    <line x1="30" y1="0" x2="30" y2="140" stroke="#45475a" stroke-width="1"/>
    <!-- X axis -->
    <line x1="30" y1="140" x2="650" y2="140" stroke="#45475a" stroke-width="1"/>
    <!-- Bars -->
    <rect x="60" y="0" width="60" height="140" rx="4" fill="#f38ba8" opacity="0.7"/><text x="90" y="155" text-anchor="middle" fill="#cdd6f4" font-size="10">7</text><text x="90" y="168" text-anchor="middle" fill="#6c7086" font-size="9">day 0</text>
    <rect x="160" y="120" width="60" height="20" rx="4" fill="#a6e3a1"/><text x="190" y="155" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">1 ←buy</text><text x="190" y="168" text-anchor="middle" fill="#6c7086" font-size="9">day 1</text>
    <rect x="260" y="40" width="60" height="100" rx="4" fill="#89b4fa" opacity="0.6"/><text x="290" y="155" text-anchor="middle" fill="#cdd6f4" font-size="10">5</text><text x="290" y="168" text-anchor="middle" fill="#6c7086" font-size="9">day 2</text>
    <rect x="360" y="80" width="60" height="60" rx="4" fill="#89b4fa" opacity="0.4"/><text x="390" y="155" text-anchor="middle" fill="#cdd6f4" font-size="10">3</text><text x="390" y="168" text-anchor="middle" fill="#6c7086" font-size="9">day 3</text>
    <rect x="460" y="20" width="60" height="120" rx="4" fill="#f9e2af"/><text x="490" y="155" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">6 ←sell</text><text x="490" y="168" text-anchor="middle" fill="#6c7086" font-size="9">day 4</text>
    <rect x="560" y="60" width="60" height="80" rx="4" fill="#89b4fa" opacity="0.4"/><text x="590" y="155" text-anchor="middle" fill="#cdd6f4" font-size="10">4</text><text x="590" y="168" text-anchor="middle" fill="#6c7086" font-size="9">day 5</text>
    <!-- Profit arrow -->
    <line x1="190" y1="130" x2="490" y2="30" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="340" y="70" fill="#a6e3a1" font-size="12" font-weight="bold">profit = 5</text>
  </g>

  <!-- Steps -->
  <g transform="translate(30, 245)">
    <rect x="0" y="0" width="690" height="26" rx="4" fill="#45475a"/>
    <text x="35" y="18" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">Step</text>
    <text x="100" y="18" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">i (buy)</text>
    <text x="170" y="18" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">j (sell)</text>
    <text x="255" y="18" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">prices[i]</text>
    <text x="340" y="18" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">prices[j]</text>
    <text x="440" y="18" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">Action</text>
    <text x="600" y="18" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">max profit</text>

    <rect x="0" y="30" width="690" height="24" fill="#313244"/>
    <text x="35" y="46" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <text x="100" y="46" text-anchor="middle" fill="#cdd6f4" font-size="10">0</text>
    <text x="170" y="46" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <text x="255" y="46" text-anchor="middle" fill="#f38ba8" font-size="10">7</text>
    <text x="340" y="46" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <text x="440" y="46" text-anchor="middle" fill="#f9e2af" font-size="10">1 &lt; 7 → move buy (i=1)</text>
    <text x="600" y="46" text-anchor="middle" fill="#cdd6f4" font-size="10">0</text>

    <rect x="0" y="56" width="690" height="24" fill="#2a2a3c"/>
    <text x="35" y="72" text-anchor="middle" fill="#cdd6f4" font-size="10">2</text>
    <text x="100" y="72" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <text x="170" y="72" text-anchor="middle" fill="#cdd6f4" font-size="10">2</text>
    <text x="255" y="72" text-anchor="middle" fill="#a6e3a1" font-size="10">1</text>
    <text x="340" y="72" text-anchor="middle" fill="#cdd6f4" font-size="10">5</text>
    <text x="440" y="72" text-anchor="middle" fill="#a6e3a1" font-size="10">5-1=4 profit</text>
    <text x="600" y="72" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">4</text>

    <rect x="0" y="82" width="690" height="24" fill="#313244"/>
    <text x="35" y="98" text-anchor="middle" fill="#cdd6f4" font-size="10">3</text>
    <text x="100" y="98" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <text x="170" y="98" text-anchor="middle" fill="#cdd6f4" font-size="10">3</text>
    <text x="255" y="98" text-anchor="middle" fill="#a6e3a1" font-size="10">1</text>
    <text x="340" y="98" text-anchor="middle" fill="#cdd6f4" font-size="10">3</text>
    <text x="440" y="98" text-anchor="middle" fill="#a6adc8" font-size="10">3-1=2 profit</text>
    <text x="600" y="98" text-anchor="middle" fill="#cdd6f4" font-size="10">4</text>

    <rect x="0" y="108" width="690" height="26" fill="#1e3a2f" stroke="#a6e3a1"/>
    <text x="35" y="126" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">4</text>
    <text x="100" y="126" text-anchor="middle" fill="#a6e3a1" font-size="10">1</text>
    <text x="170" y="126" text-anchor="middle" fill="#a6e3a1" font-size="10">4</text>
    <text x="255" y="126" text-anchor="middle" fill="#a6e3a1" font-size="10">1</text>
    <text x="340" y="126" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">6</text>
    <text x="440" y="126" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">6-1=5 profit ⭐</text>
    <text x="600" y="126" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">5</text>

    <rect x="0" y="136" width="690" height="24" fill="#313244"/>
    <text x="35" y="152" text-anchor="middle" fill="#cdd6f4" font-size="10">5</text>
    <text x="100" y="152" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <text x="170" y="152" text-anchor="middle" fill="#cdd6f4" font-size="10">5</text>
    <text x="255" y="152" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <text x="340" y="152" text-anchor="middle" fill="#cdd6f4" font-size="10">4</text>
    <text x="440" y="152" text-anchor="middle" fill="#a6adc8" font-size="10">4-1=3 profit</text>
    <text x="600" y="152" text-anchor="middle" fill="#cdd6f4" font-size="10">5</text>
  </g>

  <rect x="250" y="435" width="250" height="32" rx="16" fill="#a6e3a1"/>
  <text x="375" y="456" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Max Profit: 5 ✅</text>
</svg>