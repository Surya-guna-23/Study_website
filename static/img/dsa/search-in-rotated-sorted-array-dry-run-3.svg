<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgsr3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="370" rx="12" fill="url(#bgsr3)"/>
  <text x="360" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Search in Rotated Sorted Array — Step 3 of 3</text>
  <text x="360" y="50" text-anchor="middle" fill="#6c7086" font-size="12">nums = [4, 5, 6, 7, 0, 1, 2], target = 0</text>

  <!-- Array -->
  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="39" y="28" text-anchor="middle" fill="#45475a" font-size="15">4</text>

    <rect x="86" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="125" y="28" text-anchor="middle" fill="#45475a" font-size="15">5</text>

    <rect x="172" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="211" y="28" text-anchor="middle" fill="#45475a" font-size="15">6</text>

    <rect x="258" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="297" y="28" text-anchor="middle" fill="#45475a" font-size="15">7</text>

    <rect x="344" y="0" width="78" height="44" rx="6" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="2"/>
    <text x="383" y="28" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">0</text>
    <text x="383" y="-8" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">mid=4 ✓</text>

    <rect x="430" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="469" y="28" text-anchor="middle" fill="#45475a" font-size="15">1</text>

    <rect x="516" y="0" width="78" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="555" y="28" text-anchor="middle" fill="#45475a" font-size="15">2</text>

    <!-- Pointer -->
    <text x="383" y="62" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">low = high</text>
  </g>

  <!-- Step details -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="660" height="110" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <text x="15" y="25" fill="#a6e3a1" font-size="14" font-weight="bold">Iteration 3 — FOUND!</text>
    <text x="15" y="50" fill="#a6adc8" font-size="12">mid = Math.ceil((4 + 4) / 2) = 4</text>
    <text x="15" y="70" fill="#a6adc8" font-size="12">nums[4] = 0</text>
    <text x="15" y="95" fill="#a6e3a1" font-size="14" font-weight="bold">nums[mid] === target → Return 4 ✅</text>

    <text x="600" y="65" fill="#a6e3a1" font-size="48">✓</text>
  </g>

  <!-- Result -->
  <rect x="230" y="310" width="260" height="38" rx="19" fill="#a6e3a1"/>
  <text x="360" y="334" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">Output: 4</text>
</svg>
