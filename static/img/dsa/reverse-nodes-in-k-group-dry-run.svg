<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 460" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgrk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="750" height="460" rx="12" fill="url(#bgrk)"/>
  <text x="375" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Reverse Nodes in k-Group — Dry Run: [1,2,3,4,5], k=2</text>

  <!-- Original -->
  <text x="30" y="58" fill="#89b4fa" font-size="12" font-weight="bold">Original: 1 → 2 → 3 → 4 → 5</text>

  <!-- Iteration 1 -->
  <g transform="translate(30, 72)">
    <rect x="0" y="0" width="690" height="100" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="15" y="22" fill="#89b4fa" font-size="13" font-weight="bold">Iteration 1: Group [1, 2]</text>
    <text x="15" y="42" fill="#a6adc8" font-size="11">findkthnode(1, 2) → node 2 | nextnode = 3</text>
    <text x="15" y="60" fill="#a6adc8" font-size="11">Detach: 1→2→null | reverse(1) → 2→1→null</text>
    <text x="15" y="78" fill="#a6adc8" font-size="11">First group → head = 2 | prevnode = 1</text>
    <!-- Visual -->
    <g transform="translate(450, 22)">
      <rect x="0" y="0" width="40" height="28" rx="6" fill="#a6e3a1"/><text x="20" y="19" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">2</text>
      <text x="45" y="19" fill="#a6e3a1" font-size="11">→</text>
      <rect x="56" y="0" width="40" height="28" rx="6" fill="#a6e3a1"/><text x="76" y="19" text-anchor="middle" fill="#1e1e2e" font-size="12" font-weight="bold">1</text>
      <text x="106" y="19" fill="#6c7086" font-size="11">  3→4→5</text>
    </g>
  </g>

  <!-- Iteration 2 -->
  <g transform="translate(30, 182)">
    <rect x="0" y="0" width="690" height="100" rx="8" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="15" y="22" fill="#cba6f7" font-size="13" font-weight="bold">Iteration 2: Group [3, 4]</text>
    <text x="15" y="42" fill="#a6adc8" font-size="11">findkthnode(3, 2) → node 4 | nextnode = 5</text>
    <text x="15" y="60" fill="#a6adc8" font-size="11">Detach: 3→4→null | reverse(3) → 4→3→null</text>
    <text x="15" y="78" fill="#a6adc8" font-size="11">prevnode(1).next = 4 | prevnode = 3</text>
    <g transform="translate(400, 22)">
      <rect x="0" y="0" width="36" height="26" rx="5" fill="#a6e3a1"/><text x="18" y="18" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">2</text>
      <text x="40" y="18" fill="#a6e3a1" font-size="10">→</text>
      <rect x="50" y="0" width="36" height="26" rx="5" fill="#a6e3a1"/><text x="68" y="18" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">1</text>
      <text x="90" y="18" fill="#cba6f7" font-size="10">→</text>
      <rect x="100" y="0" width="36" height="26" rx="5" fill="#cba6f7"/><text x="118" y="18" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">4</text>
      <text x="140" y="18" fill="#cba6f7" font-size="10">→</text>
      <rect x="150" y="0" width="36" height="26" rx="5" fill="#cba6f7"/><text x="168" y="18" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">3</text>
      <text x="195" y="18" fill="#6c7086" font-size="10">  5</text>
    </g>
  </g>

  <!-- Iteration 3 -->
  <g transform="translate(30, 292)">
    <rect x="0" y="0" width="690" height="80" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="15" y="22" fill="#f9e2af" font-size="13" font-weight="bold">Iteration 3: Group [5] — fewer than k=2 nodes</text>
    <text x="15" y="42" fill="#a6adc8" font-size="11">findkthnode(5, 2) → null (only 1 node left)</text>
    <text x="15" y="60" fill="#a6e3a1" font-size="11" font-weight="bold">prevnode(3).next = 5 → attach remaining as-is → break</text>
  </g>

  <!-- Final result -->
  <text x="30" y="400" fill="#a6e3a1" font-size="14" font-weight="bold">Final Result:</text>
  <g transform="translate(160, 385)">
    <rect x="0" y="0" width="48" height="36" rx="8" fill="#a6e3a1"/><text x="24" y="24" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">2</text>
    <text x="55" y="24" fill="#a6e3a1" font-size="16">→</text>
    <rect x="68" y="0" width="48" height="36" rx="8" fill="#a6e3a1"/><text x="92" y="24" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">1</text>
    <text x="123" y="24" fill="#a6e3a1" font-size="16">→</text>
    <rect x="136" y="0" width="48" height="36" rx="8" fill="#cba6f7"/><text x="160" y="24" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">4</text>
    <text x="191" y="24" fill="#a6e3a1" font-size="16">→</text>
    <rect x="204" y="0" width="48" height="36" rx="8" fill="#cba6f7"/><text x="228" y="24" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">3</text>
    <text x="259" y="24" fill="#a6e3a1" font-size="16">→</text>
    <rect x="272" y="0" width="48" height="36" rx="8" fill="#45475a" stroke="#f9e2af"/><text x="296" y="24" text-anchor="middle" fill="#f9e2af" font-size="15" font-weight="bold">5</text>
    <text x="335" y="24" fill="#a6e3a1" font-size="12"> ✅</text>
  </g>
  <g transform="translate(160, 430)">
    <text x="0" y="14" fill="#a6e3a1" font-size="10">■ group 1 reversed</text>
    <text x="130" y="14" fill="#cba6f7" font-size="10">■ group 2 reversed</text>
    <text x="260" y="14" fill="#f9e2af" font-size="10">■ remaining (as-is)</text>
  </g>
</svg>