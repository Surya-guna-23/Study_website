<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgmd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="12" fill="url(#bgmd1)"/>
  <text x="360" y="28" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Median of Two Sorted Arrays — Step 1 of 2</text>
  <text x="360" y="46" text-anchor="middle" fill="#6c7086" font-size="11">nums1 = [1, 2], nums2 = [3, 4] → n=4 (even), left partition size = 2</text>

  <!-- Two arrays -->
  <g transform="translate(30, 65)">
    <text x="0" y="14" fill="#89b4fa" font-size="12" font-weight="bold">nums1:</text>
    <rect x="65" y="0" width="65" height="36" rx="6" fill="#89b4fa"/>
    <text x="97" y="24" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">1</text>
    <rect x="140" y="0" width="65" height="36" rx="6" fill="#f9e2af"/>
    <text x="172" y="24" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">2</text>

    <text x="250" y="14" fill="#f38ba8" font-size="12" font-weight="bold">nums2:</text>
    <rect x="310" y="0" width="65" height="36" rx="6" fill="#f38ba8"/>
    <text x="342" y="24" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">3</text>
    <rect x="385" y="0" width="65" height="36" rx="6" fill="#f38ba8"/>
    <text x="417" y="24" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">4</text>
  </g>

  <!-- Partition visualization -->
  <g transform="translate(30, 120)">
    <text x="0" y="14" fill="#f9e2af" font-size="13" font-weight="bold">Partition (mid1=1, mid2=1):</text>

    <rect x="30" y="28" width="280" height="80" rx="8" fill="#313244" stroke="#89b4fa"/>
    <text x="170" y="44" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">LEFT PARTITION</text>

    <rect x="340" y="28" width="280" height="80" rx="8" fill="#313244" stroke="#f38ba8"/>
    <text x="480" y="44" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">RIGHT PARTITION</text>

    <!-- Left side elements -->
    <rect x="60" y="56" width="55" height="36" rx="5" fill="#89b4fa"/>
    <text x="87" y="79" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">1</text>
    <text x="87" y="102" text-anchor="middle" fill="#89b4fa" font-size="9">l1</text>

    <rect x="140" y="56" width="55" height="36" rx="5" fill="#f38ba8"/>
    <text x="167" y="79" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">3</text>
    <text x="167" y="102" text-anchor="middle" fill="#f38ba8" font-size="9">l2</text>

    <!-- Divider -->
    <line x1="320" y1="28" x2="320" y2="108" stroke="#f9e2af" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Right side elements -->
    <rect x="370" y="56" width="55" height="36" rx="5" fill="#89b4fa"/>
    <text x="397" y="79" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">2</text>
    <text x="397" y="102" text-anchor="middle" fill="#89b4fa" font-size="9">r1</text>

    <rect x="450" y="56" width="55" height="36" rx="5" fill="#f38ba8"/>
    <text x="477" y="79" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">4</text>
    <text x="477" y="102" text-anchor="middle" fill="#f38ba8" font-size="9">r2</text>
  </g>

  <!-- Check -->
  <g transform="translate(30, 248)">
    <rect x="0" y="0" width="660" height="130" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="25" fill="#89b4fa" font-size="14" font-weight="bold">Iteration 1: Check cross-boundary condition</text>
    <text x="15" y="50" fill="#a6adc8" font-size="12">l1 = nums1[0] = 1, r1 = nums1[1] = 2</text>
    <text x="15" y="68" fill="#a6adc8" font-size="12">l2 = nums2[0] = 3, r2 = nums2[1] = 4</text>
    <text x="15" y="90" fill="#a6adc8" font-size="12">l1 (1) ≤ r2 (4)? <tspan fill="#a6e3a1">YES ✓</tspan>    l2 (3) ≤ r1 (2)? <tspan fill="#f38ba8" font-weight="bold">NO ✗</tspan></text>
    <text x="15" y="115" fill="#f38ba8" font-size="13" font-weight="bold">l2 &gt; r1 → Too few from nums1 → low = mid1 + 1 = 2</text>
  </g>

  <!-- Progress -->
  <rect x="230" y="395" width="260" height="20" rx="10" fill="#313244" stroke="#45475a"/>
  <rect x="230" y="395" width="130" height="20" rx="10" fill="#89b4fa"/>
  <text x="360" y="409" text-anchor="middle" fill="#cdd6f4" font-size="10" font-weight="bold">Step 1 / 2</text>
</svg>
