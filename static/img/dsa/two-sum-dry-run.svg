<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="12" fill="url(#bg3)"/>
  <text x="360" y="35" text-anchor="middle" fill="#cdd6f4" font-size="17" font-weight="bold">Two Sum — Dry Run: nums = [2, 7, 11, 15], target = 9</text>

  <!-- Array -->
  <text x="30" y="68" fill="#89b4fa" font-size="13" font-weight="bold">Input Array:</text>
  <g transform="translate(30, 78)">
    <rect x="0" y="0" width="55" height="40" rx="6" fill="#89b4fa"/><text x="27" y="26" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">2</text><text x="27" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=0</text>
    <rect x="65" y="0" width="55" height="40" rx="6" fill="#a6e3a1"/><text x="92" y="26" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">7</text><text x="92" y="-6" text-anchor="middle" fill="#a6e3a1" font-size="10">i=1 ✓</text>
    <rect x="130" y="0" width="55" height="40" rx="6" fill="#313244" stroke="#585b70"/><text x="157" y="26" text-anchor="middle" fill="#6c7086" font-size="16">11</text><text x="157" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=2</text>
    <rect x="195" y="0" width="55" height="40" rx="6" fill="#313244" stroke="#585b70"/><text x="222" y="26" text-anchor="middle" fill="#6c7086" font-size="16">15</text><text x="222" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=3</text>
  </g>
  <text x="420" y="100" fill="#f9e2af" font-size="13">target = 9</text>

  <!-- Step 1 -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="660" height="85" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="22" fill="#89b4fa" font-size="13" font-weight="bold">Step 1: i = 0, nums[0] = 2</text>
    <text x="15" y="44" fill="#a6adc8" font-size="12">Complement: target - nums[0] = 9 - 2 = 7</text>
    <text x="15" y="62" fill="#a6adc8" font-size="12">map.has(7)? → No (map is empty)</text>
    <text x="15" y="78" fill="#f9e2af" font-size="12">Action: Store map.set(2, 0)</text>
    
    <text x="420" y="22" fill="#6c7086" font-size="12">Map State:</text>
    <rect x="420" y="30" width="120" height="40" rx="6" fill="#45475a"/>
    <text x="440" y="52" fill="#89b4fa" font-size="12">2 → 0</text>
  </g>

  <!-- Step 2 (Found!) -->
  <g transform="translate(30, 250)">
    <rect x="0" y="0" width="660" height="95" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <text x="15" y="22" fill="#a6e3a1" font-size="13" font-weight="bold">Step 2: i = 1, nums[1] = 7 — FOUND!</text>
    <text x="15" y="44" fill="#a6adc8" font-size="12">Complement: target - nums[1] = 9 - 7 = 2</text>
    <text x="15" y="62" fill="#a6e3a1" font-size="12">map.has(2)? → YES! Found at index 0</text>
    <text x="15" y="82" fill="#a6e3a1" font-size="12" font-weight="bold">Return [map.get(2), 1] = [0, 1] ✅</text>
    
    <text x="420" y="22" fill="#6c7086" font-size="12">Map State:</text>
    <rect x="420" y="30" width="120" height="40" rx="6" fill="#45475a" stroke="#a6e3a1"/>
    <text x="440" y="52" fill="#a6e3a1" font-size="12" font-weight="bold">2 → 0</text>
    <!-- Arrow showing the match -->
    <text x="420" y="88" fill="#a6e3a1" font-size="12">↑ complement 2 found here!</text>
  </g>

  <!-- Result -->
  <rect x="230" y="365" width="260" height="38" rx="19" fill="#a6e3a1"/>
  <text x="360" y="390" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">Output: [0, 1]</text>
</svg>