<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgpe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="470" rx="12" fill="url(#bgpe)"/>
  <text x="360" y="35" text-anchor="middle" fill="#cdd6f4" font-size="17" font-weight="bold">Product Except Self — Dry Run: nums = [1, 2, 3, 4]</text>

  <!-- Input Array -->
  <text x="30" y="68" fill="#89b4fa" font-size="13" font-weight="bold">Input Array:</text>
  <g transform="translate(30, 78)">
    <rect x="0" y="0" width="55" height="40" rx="6" fill="#89b4fa"/><text x="27" y="26" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">1</text><text x="27" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=0</text>
    <rect x="65" y="0" width="55" height="40" rx="6" fill="#89b4fa"/><text x="92" y="26" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">2</text><text x="92" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=1</text>
    <rect x="130" y="0" width="55" height="40" rx="6" fill="#89b4fa"/><text x="157" y="26" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">3</text><text x="157" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=2</text>
    <rect x="195" y="0" width="55" height="40" rx="6" fill="#89b4fa"/><text x="222" y="26" text-anchor="middle" fill="#1e1e2e" font-size="16" font-weight="bold">4</text><text x="222" y="-6" text-anchor="middle" fill="#6c7086" font-size="10">i=3</text>
  </g>

  <!-- Prefix pass -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="660" height="95" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="22" fill="#89b4fa" font-size="13" font-weight="bold">Pass 1 — Prefix products (left → right): answer[i] = answer[i-1] * nums[i-1]</text>
    <text x="15" y="44" fill="#a6adc8" font-size="12">i=0: seed 1   |   i=1: 1*1=1   |   i=2: 1*2=2   |   i=3: 2*3=6</text>
    <text x="15" y="66" fill="#f9e2af" font-size="12">answer after prefix pass:</text>
    <g transform="translate(230, 54)">
      <rect x="0" y="0" width="50" height="30" rx="5" fill="#45475a"/><text x="25" y="20" text-anchor="middle" fill="#f9e2af" font-size="13">1</text>
      <rect x="55" y="0" width="50" height="30" rx="5" fill="#45475a"/><text x="80" y="20" text-anchor="middle" fill="#f9e2af" font-size="13">1</text>
      <rect x="110" y="0" width="50" height="30" rx="5" fill="#45475a"/><text x="135" y="20" text-anchor="middle" fill="#f9e2af" font-size="13">2</text>
      <rect x="165" y="0" width="50" height="30" rx="5" fill="#45475a"/><text x="190" y="20" text-anchor="middle" fill="#f9e2af" font-size="13">6</text>
    </g>
  </g>

  <!-- Suffix pass -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="660" height="115" rx="8" fill="#1e3a2f" stroke="#a6e3a1" stroke-width="2"/>
    <text x="15" y="22" fill="#a6e3a1" font-size="13" font-weight="bold">Pass 2 — Suffix products (right → left): answer[i] *= right; right *= nums[i]</text>
    <text x="15" y="44" fill="#a6adc8" font-size="12">i=3: 6*1=6, right=4   |   i=2: 2*4=8, right=12</text>
    <text x="15" y="62" fill="#a6adc8" font-size="12">i=1: 1*12=12, right=24   |   i=0: 1*24=24, right=24</text>
    <text x="15" y="86" fill="#a6e3a1" font-size="12" font-weight="bold">final answer:</text>
    <g transform="translate(130, 72)">
      <rect x="0" y="0" width="50" height="30" rx="5" fill="#45475a" stroke="#a6e3a1"/><text x="25" y="20" text-anchor="middle" fill="#a6e3a1" font-size="13" font-weight="bold">24</text>
      <rect x="55" y="0" width="50" height="30" rx="5" fill="#45475a" stroke="#a6e3a1"/><text x="80" y="20" text-anchor="middle" fill="#a6e3a1" font-size="13" font-weight="bold">12</text>
      <rect x="110" y="0" width="50" height="30" rx="5" fill="#45475a" stroke="#a6e3a1"/><text x="135" y="20" text-anchor="middle" fill="#a6e3a1" font-size="13" font-weight="bold">8</text>
      <rect x="165" y="0" width="50" height="30" rx="5" fill="#45475a" stroke="#a6e3a1"/><text x="190" y="20" text-anchor="middle" fill="#a6e3a1" font-size="13" font-weight="bold">6</text>
    </g>
  </g>

  <!-- Result -->
  <rect x="210" y="400" width="300" height="38" rx="19" fill="#a6e3a1"/>
  <text x="360" y="425" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">Output: [24, 12, 8, 6]</text>
</svg>
