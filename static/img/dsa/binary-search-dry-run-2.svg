<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="720" height="370" rx="12" fill="url(#bg2)"/>
  <text x="360" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Binary Search — Step 2 of 3</text>
  <text x="360" y="50" text-anchor="middle" fill="#6c7086" font-size="12">nums = [-1, 0, 3, 5, 9, 12], target = 9</text>

  <!-- Array -->
  <g transform="translate(85, 75)">
    <rect x="0" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="37" y="28" text-anchor="middle" fill="#45475a" font-size="15">-1</text>
    <text x="37" y="-8" text-anchor="middle" fill="#45475a" font-size="10">0</text>

    <rect x="85" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="122" y="28" text-anchor="middle" fill="#45475a" font-size="15">0</text>
    <text x="122" y="-8" text-anchor="middle" fill="#45475a" font-size="10">1</text>

    <rect x="170" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="207" y="28" text-anchor="middle" fill="#45475a" font-size="15">3</text>
    <text x="207" y="-8" text-anchor="middle" fill="#45475a" font-size="10">2</text>

    <rect x="255" y="0" width="75" height="44" rx="6" fill="#1e1e2e" stroke="#313244" opacity="0.4"/>
    <text x="292" y="28" text-anchor="middle" fill="#45475a" font-size="15">5</text>
    <text x="292" y="-8" text-anchor="middle" fill="#45475a" font-size="10">3</text>

    <rect x="340" y="0" width="75" height="44" rx="6" fill="#313244" stroke="#585b70"/>
    <text x="377" y="28" text-anchor="middle" fill="#a6adc8" font-size="15">9</text>
    <text x="377" y="-8" text-anchor="middle" fill="#6c7086" font-size="10">4</text>

    <rect x="425" y="0" width="75" height="44" rx="6" fill="#f9e2af"/>
    <text x="462" y="28" text-anchor="middle" fill="#1e1e2e" font-size="15" font-weight="bold">12</text>
    <text x="462" y="-8" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">mid=5</text>

    <!-- Pointers -->
    <text x="377" y="62" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">low</text>
    <text x="462" y="62" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">high</text>
  </g>

  <!-- Step details -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="660" height="120" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="25" fill="#89b4fa" font-size="14" font-weight="bold">Call 2: helper(nums, 4, 5, 9)</text>
    <text x="15" y="50" fill="#a6adc8" font-size="12">mid = Math.ceil((4 + 5) / 2) = 5</text>
    <text x="15" y="70" fill="#a6adc8" font-size="12">nums[5] = 12</text>
    <text x="15" y="92" fill="#f9e2af" font-size="13" font-weight="bold">target (9) &lt; nums[mid] (12) → Search LEFT half</text>
    <text x="15" y="110" fill="#6c7086" font-size="11">→ Recurse: helper(nums, 4, 4, 9)</text>

    <!-- Visual arrow -->
    <text x="540" y="55" fill="#f9e2af" font-size="30">←</text>
    <text x="535" y="80" fill="#6c7086" font-size="11">go left</text>
  </g>

  <!-- Progress bar -->
  <rect x="230" y="320" width="260" height="30" rx="15" fill="#313244" stroke="#45475a"/>
  <rect x="230" y="320" width="174" height="30" rx="15" fill="#89b4fa"/>
  <text x="360" y="340" text-anchor="middle" fill="#cdd6f4" font-size="12" font-weight="bold">Step 2 / 3</text>
</svg>
