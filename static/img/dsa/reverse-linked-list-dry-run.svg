<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89b4fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a6e3a1"/>
    </marker>
  </defs>
  <rect width="750" height="480" rx="12" fill="url(#bg6)"/>
  <text x="375" y="32" text-anchor="middle" fill="#cdd6f4" font-size="17" font-weight="bold">Reverse Linked List — Dry Run: [1, 2, 3, 4, 5]</text>

  <!-- Original list -->
  <text x="30" y="65" fill="#89b4fa" font-size="13" font-weight="bold">Original:</text>
  <g transform="translate(120, 48)">
    <circle cx="0" cy="12" r="20" fill="#89b4fa"/><text x="0" y="17" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">1</text>
    <line x1="20" y1="12" x2="80" y2="12" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="100" cy="12" r="20" fill="#89b4fa"/><text x="100" y="17" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">2</text>
    <line x1="120" y1="12" x2="180" y2="12" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="200" cy="12" r="20" fill="#89b4fa"/><text x="200" y="17" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">3</text>
    <line x1="220" y1="12" x2="280" y2="12" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="300" cy="12" r="20" fill="#89b4fa"/><text x="300" y="17" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">4</text>
    <line x1="320" y1="12" x2="380" y2="12" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="400" cy="12" r="20" fill="#89b4fa"/><text x="400" y="17" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">5</text>
  </g>

  <!-- Recursion stack going down -->
  <text x="30" y="110" fill="#f9e2af" font-size="13" font-weight="bold">Recursion Down (reaching base case):</text>
  <g transform="translate(50, 118)">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="#313244" stroke="#89b4fa"/><text x="60" y="19" text-anchor="middle" fill="#89b4fa" font-size="11">reverse(1)</text>
    <text x="130" y="19" fill="#6c7086" font-size="14">→</text>
    <rect x="150" y="0" width="120" height="28" rx="6" fill="#313244" stroke="#89b4fa"/><text x="210" y="19" text-anchor="middle" fill="#89b4fa" font-size="11">reverse(2)</text>
    <text x="280" y="19" fill="#6c7086" font-size="14">→</text>
    <rect x="300" y="0" width="120" height="28" rx="6" fill="#313244" stroke="#89b4fa"/><text x="360" y="19" text-anchor="middle" fill="#89b4fa" font-size="11">reverse(3)</text>
    <text x="430" y="19" fill="#6c7086" font-size="14">→</text>
    <rect x="450" y="0" width="120" height="28" rx="6" fill="#313244" stroke="#89b4fa"/><text x="510" y="19" text-anchor="middle" fill="#89b4fa" font-size="11">reverse(4)</text>
    <text x="580" y="19" fill="#6c7086" font-size="14">→</text>
    <rect x="600" y="0" width="120" height="28" rx="6" fill="#a6e3a1" stroke="#a6e3a1"/><text x="660" y="19" text-anchor="middle" fill="#1e1e2e" font-size="11" font-weight="bold">reverse(5)⬅base</text>
  </g>

  <!-- Unwind steps -->
  <text x="30" y="180" fill="#a6e3a1" font-size="13" font-weight="bold">Unwinding (reversing pointers):</text>

  <!-- Unwind 1: reverse(4) -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="690" height="50" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="18" fill="#f9e2af" font-size="11" font-weight="bold">reverse(4):</text>
    <text x="120" y="18" fill="#a6adc8" font-size="11">head=4, front=5 → 5.next=4, 4.next=null</text>
    <!-- Visual -->
    <g transform="translate(30, 24)">
      <text x="0" y="15" fill="#6c7086" font-size="11">1→2→3→4</text>
      <text x="85" y="15" fill="#a6e3a1" font-size="11" font-weight="bold">←5</text>
    </g>
  </g>

  <!-- Unwind 2: reverse(3) -->
  <g transform="translate(30, 255)">
    <rect x="0" y="0" width="690" height="50" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="18" fill="#f9e2af" font-size="11" font-weight="bold">reverse(3):</text>
    <text x="120" y="18" fill="#a6adc8" font-size="11">head=3, front=4 → 4.next=3, 3.next=null</text>
    <g transform="translate(30, 24)">
      <text x="0" y="15" fill="#6c7086" font-size="11">1→2→3</text>
      <text x="60" y="15" fill="#a6e3a1" font-size="11" font-weight="bold">←4←5</text>
    </g>
  </g>

  <!-- Unwind 3: reverse(2) -->
  <g transform="translate(30, 315)">
    <rect x="0" y="0" width="690" height="50" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="18" fill="#f9e2af" font-size="11" font-weight="bold">reverse(2):</text>
    <text x="120" y="18" fill="#a6adc8" font-size="11">head=2, front=3 → 3.next=2, 2.next=null</text>
    <g transform="translate(30, 24)">
      <text x="0" y="15" fill="#6c7086" font-size="11">1→2</text>
      <text x="35" y="15" fill="#a6e3a1" font-size="11" font-weight="bold">←3←4←5</text>
    </g>
  </g>

  <!-- Unwind 4: reverse(1) -->
  <g transform="translate(30, 375)">
    <rect x="0" y="0" width="690" height="50" rx="8" fill="#313244" stroke="#45475a"/>
    <text x="15" y="18" fill="#f9e2af" font-size="11" font-weight="bold">reverse(1):</text>
    <text x="120" y="18" fill="#a6adc8" font-size="11">head=1, front=2 → 2.next=1, 1.next=null</text>
    <g transform="translate(30, 24)">
      <text x="0" y="15" fill="#a6e3a1" font-size="11" font-weight="bold">1←2←3←4←5</text>
    </g>
  </g>

  <!-- Final reversed list -->
  <text x="30" y="450" fill="#a6e3a1" font-size="13" font-weight="bold">Result (new head = 5):</text>
  <g transform="translate(220, 435)">
    <circle cx="0" cy="12" r="18" fill="#a6e3a1"/><text x="0" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">5</text>
    <line x1="18" y1="12" x2="62" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <circle cx="80" cy="12" r="18" fill="#a6e3a1"/><text x="80" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">4</text>
    <line x1="98" y1="12" x2="142" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <circle cx="160" cy="12" r="18" fill="#a6e3a1"/><text x="160" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">3</text>
    <line x1="178" y1="12" x2="222" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <circle cx="240" cy="12" r="18" fill="#a6e3a1"/><text x="240" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">2</text>
    <line x1="258" y1="12" x2="302" y2="12" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <circle cx="320" cy="12" r="18" fill="#a6e3a1"/><text x="320" y="17" text-anchor="middle" fill="#1e1e2e" font-size="13" font-weight="bold">1</text>
    <text x="355" y="17" fill="#a6e3a1" font-size="12">→ null ✅</text>
  </g>
</svg>