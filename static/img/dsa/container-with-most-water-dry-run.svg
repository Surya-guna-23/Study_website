<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgcw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1" /><stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="780" height="500" rx="12" fill="url(#bgcw)"/>
  <text x="390" y="28" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Container With Most Water — Dry Run</text>
  <text x="390" y="46" text-anchor="middle" fill="#6c7086" font-size="12">height = [1, 8, 6, 2, 5, 4, 8, 3, 7]</text>

  <!-- Bar chart visualization -->
  <g transform="translate(60, 55)">
    <!-- Bars (max height 8 → scale: 18px per unit) -->
    <rect x="0" y="126" width="45" height="18" rx="4" fill="#6c7086"/><text x="22" y="160" text-anchor="middle" fill="#cdd6f4" font-size="10">1</text>
    <rect x="70" y="0" width="45" height="144" rx="4" fill="#89b4fa"/><text x="92" y="160" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">8</text>
    <rect x="140" y="36" width="45" height="108" rx="4" fill="#89b4fa" opacity="0.6"/><text x="162" y="160" text-anchor="middle" fill="#cdd6f4" font-size="10">6</text>
    <rect x="210" y="108" width="45" height="36" rx="4" fill="#6c7086"/><text x="232" y="160" text-anchor="middle" fill="#cdd6f4" font-size="10">2</text>
    <rect x="280" y="54" width="45" height="90" rx="4" fill="#6c7086"/><text x="302" y="160" text-anchor="middle" fill="#cdd6f4" font-size="10">5</text>
    <rect x="350" y="72" width="45" height="72" rx="4" fill="#6c7086"/><text x="372" y="160" text-anchor="middle" fill="#cdd6f4" font-size="10">4</text>
    <rect x="420" y="0" width="45" height="144" rx="4" fill="#f9e2af"/><text x="442" y="160" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">8</text>
    <rect x="490" y="90" width="45" height="54" rx="4" fill="#6c7086"/><text x="512" y="160" text-anchor="middle" fill="#cdd6f4" font-size="10">3</text>
    <rect x="560" y="18" width="45" height="126" rx="4" fill="#a6e3a1"/><text x="582" y="160" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">7</text>
    <!-- Best container highlight -->
    <rect x="70" y="18" width="512" height="126" rx="4" fill="#a6e3a1" opacity="0.08" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="326" y="85" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="bold">area = 7 × 7 = 49</text>
    <!-- Labels -->
    <text x="22" y="178" text-anchor="middle" fill="#6c7086" font-size="9">0</text>
    <text x="92" y="178" text-anchor="middle" fill="#89b4fa" font-size="9" font-weight="bold">1</text>
    <text x="162" y="178" text-anchor="middle" fill="#6c7086" font-size="9">2</text>
    <text x="232" y="178" text-anchor="middle" fill="#6c7086" font-size="9">3</text>
    <text x="302" y="178" text-anchor="middle" fill="#6c7086" font-size="9">4</text>
    <text x="372" y="178" text-anchor="middle" fill="#6c7086" font-size="9">5</text>
    <text x="442" y="178" text-anchor="middle" fill="#6c7086" font-size="9">6</text>
    <text x="512" y="178" text-anchor="middle" fill="#6c7086" font-size="9">7</text>
    <text x="582" y="178" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">8</text>
  </g>

  <!-- Steps -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="720" height="24" rx="4" fill="#45475a"/>
    <text x="30" y="17" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">Step</text>
    <text x="90" y="17" text-anchor="middle" fill="#89b4fa" font-size="9" font-weight="bold">L</text>
    <text x="140" y="17" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">R</text>
    <text x="200" y="17" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">h[L]</text>
    <text x="260" y="17" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">h[R]</text>
    <text x="340" y="17" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">min(h) × width</text>
    <text x="470" y="17" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">Area</text>
    <text x="560" y="17" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">max</text>
    <text x="660" y="17" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">Move</text>

    <rect x="0" y="28" width="720" height="22" fill="#313244"/>
    <text x="30" y="43" text-anchor="middle" fill="#cdd6f4" font-size="9">1</text>
    <text x="90" y="43" text-anchor="middle" fill="#89b4fa" font-size="9">0</text>
    <text x="140" y="43" text-anchor="middle" fill="#f38ba8" font-size="9">8</text>
    <text x="200" y="43" text-anchor="middle" fill="#cdd6f4" font-size="9">1</text>
    <text x="260" y="43" text-anchor="middle" fill="#cdd6f4" font-size="9">7</text>
    <text x="340" y="43" text-anchor="middle" fill="#cdd6f4" font-size="9">min(1,7) × 8</text>
    <text x="470" y="43" text-anchor="middle" fill="#cdd6f4" font-size="9">8</text>
    <text x="560" y="43" text-anchor="middle" fill="#cdd6f4" font-size="9">8</text>
    <text x="660" y="43" text-anchor="middle" fill="#89b4fa" font-size="9">L++ (shorter)</text>

    <rect x="0" y="52" width="720" height="22" fill="#2a2a3c"/>
    <text x="30" y="67" text-anchor="middle" fill="#cdd6f4" font-size="9">2</text>
    <text x="90" y="67" text-anchor="middle" fill="#89b4fa" font-size="9">1</text>
    <text x="140" y="67" text-anchor="middle" fill="#f38ba8" font-size="9">8</text>
    <text x="200" y="67" text-anchor="middle" fill="#cdd6f4" font-size="9">8</text>
    <text x="260" y="67" text-anchor="middle" fill="#cdd6f4" font-size="9">7</text>
    <text x="340" y="67" text-anchor="middle" fill="#cdd6f4" font-size="9">min(8,7) × 7</text>
    <text x="470" y="67" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">49 ⭐</text>
    <text x="560" y="67" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">49</text>
    <text x="660" y="67" text-anchor="middle" fill="#f38ba8" font-size="9">R-- (shorter)</text>

    <rect x="0" y="76" width="720" height="22" fill="#313244"/>
    <text x="30" y="91" text-anchor="middle" fill="#cdd6f4" font-size="9">3</text>
    <text x="90" y="91" text-anchor="middle" fill="#cdd6f4" font-size="9">1</text>
    <text x="140" y="91" text-anchor="middle" fill="#cdd6f4" font-size="9">7</text>
    <text x="200" y="91" text-anchor="middle" fill="#cdd6f4" font-size="9">8</text>
    <text x="260" y="91" text-anchor="middle" fill="#cdd6f4" font-size="9">3</text>
    <text x="340" y="91" text-anchor="middle" fill="#cdd6f4" font-size="9">min(8,3) × 6</text>
    <text x="470" y="91" text-anchor="middle" fill="#cdd6f4" font-size="9">18</text>
    <text x="560" y="91" text-anchor="middle" fill="#cdd6f4" font-size="9">49</text>
    <text x="660" y="91" text-anchor="middle" fill="#f38ba8" font-size="9">R--</text>

    <rect x="0" y="100" width="720" height="22" fill="#2a2a3c"/>
    <text x="30" y="115" text-anchor="middle" fill="#cdd6f4" font-size="9">4</text>
    <text x="90" y="115" text-anchor="middle" fill="#cdd6f4" font-size="9">1</text>
    <text x="140" y="115" text-anchor="middle" fill="#cdd6f4" font-size="9">6</text>
    <text x="200" y="115" text-anchor="middle" fill="#cdd6f4" font-size="9">8</text>
    <text x="260" y="115" text-anchor="middle" fill="#cdd6f4" font-size="9">8</text>
    <text x="340" y="115" text-anchor="middle" fill="#cdd6f4" font-size="9">min(8,8) × 5</text>
    <text x="470" y="115" text-anchor="middle" fill="#cdd6f4" font-size="9">40</text>
    <text x="560" y="115" text-anchor="middle" fill="#cdd6f4" font-size="9">49</text>
    <text x="660" y="115" text-anchor="middle" fill="#f38ba8" font-size="9">R--</text>

    <text x="360" y="145" text-anchor="middle" fill="#6c7086" font-size="10">... continues until L meets R, max stays 49</text>
  </g>

  <rect x="260" y="455" width="260" height="32" rx="16" fill="#a6e3a1"/>
  <text x="390" y="476" text-anchor="middle" fill="#1e1e2e" font-size="14" font-weight="bold">Output: 49 ✅</text>
</svg>